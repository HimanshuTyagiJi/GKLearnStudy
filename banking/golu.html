<!-- Injecting User TOC Script -->

                <script>
                    document.addEventListener('DOMContentLoaded', () => {
                        const tocLists = document.querySelectorAll('#toc-list-desktop, #toc-list-mobile');
                        const articleContent = document.getElementById('article-content');
                        
                        if (tocLists.length === 0 || !articleContent) {
                            console.error('TOC script: Critical elements are missing.');
                            return;
                        }

                        const headings = articleContent.querySelectorAll('h2, h3');
                        
                        if (headings.length === 0) {
                            document.querySelector('.toc-sidebar-container')?.style.setProperty('display', 'none');
                            document.querySelector('.toc-mobile-container')?.style.setProperty('display', 'none');
                            return;
                        }

                        const fragment = document.createDocumentFragment();
                        const headingData = []; 

                        headings.forEach((heading, index) => {
                            const text = heading.textContent.trim();
                            if (!text) return;

                            let id = heading.id;
                            if (!id) {
                                id = `toc-heading-${index}`;
                                heading.id = id;
                            }

                            const li = document.createElement('li');
                            const a = document.createElement('a');
                            
                            a.textContent = text;
                            a.href = `#${id}`;
                            li.appendChild(a);

                            if (heading.tagName.toLowerCase() === 'h3') {
                                li.className = 'toc-level-2';
                            }

                            fragment.appendChild(li);
                            headingData.push({ id: id, element: heading });
                        });

                        tocLists.forEach(list => {
                            list.innerHTML = '';
                            list.appendChild(fragment.cloneNode(true));
                        });

                        const tocLinks = document.querySelectorAll('.toc-sidebar a, .toc-mobile-container a');
                        const topOffset = 90;

                        const onScroll = () => {
                            const scrollPosition = window.scrollY;
                            let activeId = null;
                            
                            const visibleHeadings = headingData.filter(h => h.element.offsetTop <= scrollPosition + topOffset);
                            if (visibleHeadings.length > 0) {
                                activeId = visibleHeadings[visibleHeadings.length - 1].id;
                            }

                            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 50) {
                                const lastHeading = headingData[headingData.length - 1];
                                if (lastHeading) {
                                    activeId = lastHeading.id;
                                }
                            }

                            tocLinks.forEach(link => {
                                const isActive = link.getAttribute('href') === `#${activeId}`;
                                link.classList.toggle('active', isActive);
                            });
                        };

                        let isTicking = false;
                        window.addEventListener('scroll', () => {
                            if (!isTicking) {
                                window.requestAnimationFrame(() => {
                                    onScroll();
                                    isTicking = false;
                                });
                                isTicking = true;
                            }
                        }, { passive: true });

                        onScroll();
                    });
                </script>
