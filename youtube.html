<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Video Feed</title>
    <style>
        .video-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
        }
        .video {
            margin: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            overflow: hidden;
            width: 300px;
        }
        .thumbnail {
            width: 100%;
            height: auto;
            cursor: pointer; /* Change cursor to pointer for thumbnails */
        }
        .title {
            text-align: center;
            padding: 10px;
        }
        .iframe-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
        }
        .iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

<h1>YouTube Video Feed</h1>
<div class="video-container" id="videoContainer">Loading videos...</div>

<script>
    // XML feed URL
    
  const xmlFeedUrl = 'https://gklearnstudy.in/https://www.youtube.com/feeds/videos.xml?channel_id=UCFo8q8WIrDifqtFHAvmr0NQ';

    // Function to load and parse XML feed
    function loadVideos() {
        fetch(xmlFeedUrl)
            .then(response => response.text())
            .then(data => {
                const parser = new DOMParser();
                const xml = parser.parseFromString(data, "text/xml");
                const entries = xml.getElementsByTagName("entry");
                const videoContainer = document.getElementById('videoContainer');

                // Clear loading message
                videoContainer.innerHTML = '';

                // Iterate through each entry to get video data
                Array.from(entries).forEach(entry => {
                    const title = entry.getElementsByTagName("title")[0].textContent;
                    const videoId = entry.getElementsByTagName("yt:videoId")[0].textContent;

                    const videoDiv = document.createElement('div');
                    videoDiv.className = 'video';
                    videoDiv.innerHTML = `
                        <div class="iframe-container">
                            <iframe src="https://www.youtube.com/embed/${videoId}" frameborder="0" allowfullscreen></iframe>
                        </div>
                        <div class="title">${title}</div>
                    `;
                    videoContainer.appendChild(videoDiv);
                });
            })
            .catch(error => {
                console.error('Error fetching the XML feed:', error);
                document.getElementById('videoContainer').innerHTML = 'Failed to load videos.';
            });
    }

    // Load videos on page load
    loadVideos();
</script>

</body>
</html>
