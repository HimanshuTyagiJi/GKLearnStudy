<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Video Player with Thumbnails</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .video-container {
            margin: 20px auto;
            width: 80%;
            max-width: 720px;
        }
        iframe {
            width: 100%;
            border: none;
        }
        iframe.regular {
            height: 400px; /* 16:9 ratio */
        }
        iframe.shorts {
            height: 720px; /* 9:16 ratio */
        }
        .thumbnail-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        .thumbnail {
            display: inline-block;
            text-align: center;
            cursor: pointer;
        }
        .thumbnail img {
            width: 200px;
            height: 113px; /* Aspect ratio 16:9 */
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid #ddd;
            transition: transform 0.2s, border-color 0.2s;
        }
        .thumbnail img:hover {
            transform: scale(1.05);
            border-color: #007BFF;
        }
        .thumbnail span {
            display: block;
            margin-top: 10px;
            font-size: 14px;
            color: #333;
        }
    </style>
</head>
<body>
    <h1>YouTube Video Player</h1>
    <div class="video-container">
        <iframe id="video-frame" class="regular" src="" allow="autoplay"></iframe>
    </div>
    <div class="thumbnail-container" id="thumbnail-container"></div>

    <script>
        let currentVideo = null;

        fetch('videos.xml')
            .then(response => response.text())
            .then(data => {
                const parser = new DOMParser();
                const xml = parser.parseFromString(data, 'text/xml');

                const videos = xml.getElementsByTagName('video');
                const thumbnailContainer = document.getElementById('thumbnail-container');
                const videoFrame = document.getElementById('video-frame');

                for (let i = 0; i < videos.length; i++) {
                    const title = videos[i].getElementsByTagName('title')[0].textContent;
                    const url = videos[i].getElementsByTagName('url')[0].textContent;
                    const type = videos[i].getElementsByTagName('type')[0].textContent;

                    // Extract YouTube Video ID from URL
                    const videoID = url.split('/embed/')[1];

                    // Create a thumbnail element
                    const thumbnail = document.createElement('div');
                    thumbnail.className = 'thumbnail';

                    // Set thumbnail content
                    thumbnail.innerHTML = `
                        <img src="https://img.youtube.com/vi/${videoID}/mqdefault.jpg" alt="${title}">
                        <span>${title}</span>
                    `;

                    // Add click event to play video
                    thumbnail.addEventListener('click', () => {
                        if (currentVideo !== url) {
                            videoFrame.src = `${url}?autoplay=1`;
                            videoFrame.className = type === 'shorts' ? 'shorts' : 'regular';
                            currentVideo = url;
                        } else {
                            videoFrame.src = '';
                            currentVideo = null;
                        }
                    });

                    // Append thumbnail to container
                    thumbnailContainer.appendChild(thumbnail);
                }
            })
            .catch(error => console.error('Error fetching XML:', error));
    </script>
</body>
</html>
