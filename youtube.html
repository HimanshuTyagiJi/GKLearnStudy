<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XML to HTML Example</title>
</head>
<body>
    <h1>YouTube Videos</h1>
    <div id="video-list"></div>

    <script>
        // Function to fetch and display videos
        fetch('youtube.xml')
            .then(response => response.text())
            .then(data => {
                // Parse XML data
                const parser = new DOMParser();
                const xml = parser.parseFromString(data, 'text/xml');

                // Get all video nodes
                const videos = xml.getElementsByTagName('video');
                const videoList = document.getElementById('video-list');

                // Loop through each video and add to HTML
                for (let i = 0; i < videos.length; i++) {
                    const title = videos[i].getElementsByTagName('title')[0].textContent;
                    const url = videos[i].getElementsByTagName('url')[0].textContent;

                    // Create HTML structure
                    const videoDiv = document.createElement('div');
                    videoDiv.innerHTML = `<h3>${title}</h3><a href="${url}" target="_blank">${url}</a>`;
                    videoList.appendChild(videoDiv);
                }
            })
            .catch(error => {
                console.error('Error fetching XML:', error);
            });
    </script>
</body>
</html>
