<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Video Player</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .video-container {
            margin: 20px auto;
            width: 80%;
            max-width: 720px;
        }
        iframe {
            width: 100%;
            border: none;
        }
        iframe.regular {
            height: 400px; /* 16:9 ratio */
        }
        iframe.shorts {
            height: 720px; /* 9:16 ratio */
        }
        .video-buttons {
            margin-top: 20px;
        }
        .video-buttons button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>YouTube Video Player</h1>
    <div class="video-container">
        <iframe id="video-frame" class="regular" src="" allow="autoplay"></iframe>
    </div>
    <div class="video-buttons" id="video-buttons"></div>

    <script>
        let currentVideo = null;

        fetch('videos.xml')
            .then(response => response.text())
            .then(data => {
                const parser = new DOMParser();
                const xml = parser.parseFromString(data, 'text/xml');

                const videos = xml.getElementsByTagName('video');
                const videoButtons = document.getElementById('video-buttons');
                const videoFrame = document.getElementById('video-frame');

                for (let i = 0; i < videos.length; i++) {
                    const title = videos[i].getElementsByTagName('title')[0].textContent;
                    const url = videos[i].getElementsByTagName('url')[0].textContent;
                    const type = videos[i].getElementsByTagName('type')[0].textContent;

                    const button = document.createElement('button');
                    button.textContent = title;

                    button.addEventListener('click', () => {
                        if (currentVideo !== url) {
                            videoFrame.src = `${url}?autoplay=1`;
                            videoFrame.className = type === 'shorts' ? 'shorts' : 'regular';
                            currentVideo = url;
                        } else {
                            videoFrame.src = '';
                            currentVideo = null;
                        }
                    });

                    videoButtons.appendChild(button);
                }
            })
            .catch(error => console.error('Error fetching XML:', error));
    </script>
</body>
</html>
