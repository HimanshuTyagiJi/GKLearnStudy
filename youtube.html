    <script>
        const gridView = document.getElementById("grid-view");
        const playerView = document.getElementById("player-view");
        const mainVideo = document.getElementById("main-video");
        const videoList = document.getElementById("video-list");
        const backBtn = document.getElementById("back-btn");
        const subscribeCard1 = document.getElementById("subscribe-card1");
        const subscribeCard2 = document.getElementById("subscribe-card2");
        let videos = [];
        let currentVideoId = null;
        let currentVideoChannelId = null; // Variable to track current video channel ID

        // Load videos from both XML feeds
        function loadVideosFromXML() {
          const channelUrls = [
                'https://video.gklearnstudy.in/https://www.youtube.com/feeds/videos.xml?channel_id=UC5fXdqPu6-ewYPVV7JlHjkQ',
                'https://video.gklearnstudy.in/https://www.youtube.com/feeds/videos.xml?channel_id=UCFo8q8WIrDifqtFHAvmr0NQ'
            ];
            let videoPromises = channelUrls.map(url => fetchVideos(url));

            Promise.all(videoPromises).then(allVideos => {
                // Flatten the array and sort by upload date
                videos = allVideos.flat().sort((a, b) => new Date(b.uploadDate) - new Date(a.uploadDate));
                renderGridView();
            });
        }

        function fetchVideos(url) {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.open('GET', url, true);
                xhr.onload = function() {
                    if (xhr.status === 200) {
                        const parser = new DOMParser();
                        const xmlDoc = parser.parseFromString(xhr.responseText, "text/xml");
                        const videoEntries = xmlDoc.getElementsByTagName('entry');
                        const videos = [];

                        for (let i = 0; i < videoEntries.length; i++) {
                            const title = videoEntries[i].getElementsByTagName('title')[0].textContent;
                            const link = videoEntries[i].getElementsByTagName('link')[0].getAttribute('href');
                            const uploadDate = videoEntries[i].getElementsByTagName('published')[0].textContent;
                            const channelId = videoEntries[i].getElementsByTagName('yt:channelId')[0].textContent; // Get channel ID
                            videos.push({ title: title, id: getVideoId(link), uploadDate: uploadDate, channelId: channelId });
                        }
                        resolve(videos);
                    } else {
                        reject('Failed to load XML file: Status ' + xhr.status);
                    }
                };
                xhr.onerror = function() {
                    reject('An error occurred while fetching the XML file.');
                };
                xhr.send();
            });
        }

        function getVideoId(url) {
            const urlParts = new URL(url);
            return urlParts.searchParams.get('v');
        }

       function renderGridView() {
            gridView.innerHTML = videos.map(video => `
                <div class="video-item" onclick="playVideo('${video.id}', '${video.channelId}')">
                    <img src="https://img.youtube.com/vi/${video.id}/hqdefault.jpg" alt="${video.title}">
                    <h3>${video.title}</h3>
                </div>
            `).join('');
            gridView.style.display = "grid";
        }

       function playVideo(videoId, channelId) {
    currentVideoId = videoId;
    currentVideoChannelId = channelId; // Store the current video's channel ID
   mainVideo.src = `https://www.youtube.com/embed/${videoId}?enablejsapi=1&rel=0`;

    gridView.style.display = "none";
    playerView.style.display = "flex";
    renderVideoList(); // Render video list in player view
    monitorVideoPlayback(videoId);
}

function renderVideoList() {
    videoList.innerHTML = videos.map(video => {
        // Check if the current video is the one playing
        if (video.id === currentVideoId) {
            return ''; // Do not display the currently playing video
        }
        return `
            <div class="video-list-item" onclick="playVideo('${video.id}', '${video.channelId}')">
                <img src="https://img.youtube.com/vi/${video.id}/hqdefault.jpg" alt="${video.title}">
                <div>
                    <h3>${video.title}</h3>
                </div>
            </div>
        `;
    }).join('');
}

        backBtn.addEventListener('click', navigateToHome);

        function navigateToHome() {
            gridView.style.display = "grid";
            playerView.style.display = "none";
            currentVideoId = null;
            currentVideoChannelId = null; // Reset channel ID
            mainVideo.src = ""; // Clear video source
            subscribeCard1.style.display = "none"; // Hide the first subscribe card
            subscribeCard2.style.display = "none"; // Hide the second subscribe card
        }

        // Monitor video playback
       function monitorVideoPlayback(videoId) {
    const player = new YT.Player('main-video', {
        videoId: videoId,
        events: {
            'onReady': (event) => {
                event.target.playVideo();
            },
            'onStateChange': (event) => {
                if (event.data === YT.PlayerState.ENDED) {
                    // Hide subscribe cards based on the channel ID
                    if (currentVideoChannelId === 'UC5fXdqPu6-ewYPVV7JlHjkQ') {
                        subscribeCard1.style.display = "block";
                        subscribeCard2.style.display = "none";
                    } else if (currentVideoChannelId === 'UCFo8q8WIrDifqtFHAvmr0NQ') {
                        subscribeCard2.style.display = "block";
                        subscribeCard1.style.display = "none";
                    }
                }
            }
        },
        playerVars: {
            rel: 0, // Disable related videos
            autoplay: 1, // Autoplay video
            showinfo: 0, // Hide video info
            modestbranding: 1 // Disable YouTube branding
        }
    });
}

        // Function to show the subscribe cards based on the current video
function showSubscribeCards() {
    // Check current video's channel ID and show the corresponding subscribe card
    if (currentVideoChannelId === 'UC5fXdqPu6-ewYPVV7JlHjkQ') {
        subscribeCard1.style.display = "block"; // Show the first subscribe card
        subscribeCard2.style.display = "none"; // Hide the second subscribe card
    } else if (currentVideoChannelId === 'UCFo8q8WIrDifqtFHAvmr0NQ') {
        subscribeCard2.style.display = "block"; // Show the second subscribe card
        subscribeCard1.style.display = "none"; // Hide the first subscribe card
    } else {
        // If no valid channel ID, hide both subscribe cards
        subscribeCard1.style.display = "none";
        subscribeCard2.style.display = "none";
    }
}

// Function to play a new video
function playVideo(videoId, channelId) {
    currentVideoId = videoId;
    currentVideoChannelId = channelId; // Store the current video's channel ID
    mainVideo.src = `https://www.youtube.com/embed/${videoId}?enablejsapi=1`;
    gridView.style.display = "none";
    playerView.style.display = "flex";
    
    // Hide subscribe cards when a new video is played
    subscribeCard1.style.display = "none";
    subscribeCard2.style.display = "none";

    renderVideoList(); // Render video list in player view
    monitorVideoPlayback(videoId);
}

// Function to handle video end event
function onVideoEnd() {
    showSubscribeCards(); // Show the subscribe card when video ends
}

// Event listener for video end (if using YouTube API, set up event listeners accordingly)
mainVideo.addEventListener('ended', onVideoEnd);
