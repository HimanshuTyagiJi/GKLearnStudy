<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Search</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        #results {
            margin-top: 20px;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            margin: 5px 0;
        }
    </style>
</head>
<body>

    <h1>Question Search</h1>
    <input type="text" id="searchBox" placeholder="Search questions...">
    <button onclick="searchQuestions()">Search</button>

    <div id="results">
        <ul id="resultsList"></ul>
    </div>

    <script>
       let questions = []; // सभी प्रश्नों को स्टोर करने के लिए एक खाली ऐरे

// XML साइटमैप से प्रश्न लोड करने वाला फ़ंक्शन
async function loadQuestions() {
    try {
        const response = await fetch('https://gklearnstudy.in/sitemap.xml');
        const xmlText = await response.text();
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
        const questionElements = xmlDoc.getElementsByTagName('url'); // सभी URL तत्व

        // प्रत्येक प्रश्न से जानकारी प्राप्त करना
        for (let i = 0; i < questionElements.length; i++) {
            const url = questionElements[i].getElementsByTagName('loc')[0].textContent;
            const titleElements = questionElements[i].getElementsByTagName('title');
            const title = titleElements.length > 0 ? titleElements[0].textContent : ''; // शीर्षक प्राप्त करें

            if (title) { // सुनिश्चित करें कि शीर्षक मौजूद है
                questions.push({ url, title }); // प्रश्नों को ऐरे में जोड़ना
            }
        }

        console.log(questions); // प्रश्नों की सूची को कंसोल में प्रिंट करें

    } catch (error) {
        console.error('Error loading questions:', error);
    }
}

// सर्च फ़ंक्शन
function searchQuestions() {
    const input = document.getElementById("searchBox").value.toLowerCase(); // यूजर का इनपुट
    const results = questions.filter(q => q.title.toLowerCase().includes(input)); // सर्च से मेल खाते सवाल छांटें

    const resultsList = document.getElementById("resultsList");
    resultsList.innerHTML = ''; // पहले से मौजूद परिणामों को साफ़ करें

    // परिणाम दिखाएं
    if (results.length > 0) {
        results.forEach(q => {
            const listItem = document.createElement('li');
            listItem.innerHTML = `<a href="${q.url}" target="_blank">${q.title}</a>`;
            resultsList.appendChild(listItem);
        });
    } else {
        resultsList.innerHTML = "<li>No results found</li>";
    }
}

// पृष्ठ लोड होने पर प्रश्न लोड करें
window.onload = loadQuestions;

    </script>
</body>
</html>
