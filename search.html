<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Questions</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        #searchContainer {
            margin-bottom: 20px;
        }
        #results {
            list-style: none;
            padding: 0;
        }
        #results li {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div id="searchContainer">
        <input type="text" id="searchBox" placeholder="Search questions..." />
        <button onclick="searchQuestions()">Search</button>
    </div>
    <ul id="results"></ul>

    <script>
        let questions = []; // सभी प्रश्नों को स्टोर करने के लिए एक खाली ऐरे

        // XML साइटमैप से प्रश्न लोड करने वाला फ़ंक्शन
        async function loadQuestions() {
            const response = await fetch('https://gklearnstudy.in/path/to/your/sitemap.xml');
            const xmlText = await response.text();
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
            const questionElements = xmlDoc.getElementsByTagName('question');

            // प्रत्येक प्रश्न से जानकारी प्राप्त करना
            for (let i = 0; i < questionElements.length; i++) {
                const url = questionElements[i].getElementsByTagName('loc')[0].textContent;
                const title = questionElements[i].getElementsByTagName('title')[0].textContent;
                questions.push({ url, title }); // प्रश्नों को ऐरे में जोड़ना
            }
        }

        // प्रश्नों की खोज करने वाला फ़ंक्शन
        function searchQuestions() {
            const input = document.getElementById("searchBox").value.toLowerCase(); // यूजर का इनपुट
            const results = questions.filter(q => q.title.toLowerCase().includes(input)); // सर्च से मेल खाते सवाल छांटें

            const resultsList = document.getElementById("results");
            resultsList.innerHTML = ''; // पहले से मौजूद परिणामों को साफ़ करें

            // परिणाम दिखाएं
            if (results.length > 0) {
                results.forEach(q => {
                    const listItem = document.createElement('li');
                    listItem.innerHTML = `<a href="${q.url}" target="_blank">${q.title}</a>`;
                    resultsList.appendChild(listItem);
                });
            } else {
                resultsList.innerHTML = "<li>No results found</li>";
            }
        }

        // पृष्ठ लोड होने पर प्रश्न लोड करें
        window.onload = loadQuestions;
    </script>
</body>
</html>
