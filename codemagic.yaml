workflows:
  react-native-android:
    name: React Native Android Build
    max_build_duration: 60
    environment:
      vars:
        PACKAGE_NAME: "com.gklearnstudy.himanshu" # Apne package ka naam likho
      flutter: stable
      node: 16
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: GK Learn Study
        script: |
          cd android
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk
