<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XML Data Loader</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
</head>
<body>
    <div id="content"></div>

    <script>
        $(document).ready(function() {
            $.ajax({
                type: "GET",
                url: "sitemap.xml",
                dataType: "xml",
                success: function(xml) {
                    $(xml).find('url').each(function() {
                        var loc = $(this).find('loc').text();
                        var title = $(this).find('title').text();
                        var image = $(this).find('image loc').text();
                        var description = $(this).find('p').text();

                        $('#content').append(
                            '<div><a href="' + loc + '" target="_blank">' +
                            '<div class="row">' +
                            '<div class="leftside">' +
                            '<img src="' + image + '" alt="Image" class="image">' +
                            '</div>' +
                            '<div class="rightside">' +
                            '<h4>' + title + '</h4>' +
                            '<p>' + description + '</p>' +
                            '</div>' +
                            '</div></a></div>'
                        );
                    });
                },
                error: function() {
                    console.log("Error loading XML");
                }
            });
        });
    </script>
</body>
</html>
