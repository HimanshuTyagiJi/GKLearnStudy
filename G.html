<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ancient Page</title>
</head>
<body>
    <h1>Welcome to Ancient Page</h1>
    <div id="link-container"></div>

    <script>
        // Apna custom domain ka URL yahan daalain
        const customDomain = 'https://gklearnstudy.in/'; // Apne domain ka URL dalen
        const fileName = 'प्राचीन-भारतीय-इतिहास.html';

        async function checkFileExists() {
            try {
                const response = await fetch(customDomain + fileName, { method: 'HEAD' });
                if (response.ok) {
                    // Agar file mil jaye toh link dikhaye
                    const link = document.createElement('a');
                    link.href = customDomain + fileName;
                    link.textContent = 'Visit Prachin Page';
                    link.target = '_blank';
                    document.getElementById('link-container').appendChild(link);
                } else {
                    // Agar file nahi ho toh message dikhaye
                    document.getElementById('link-container').textContent = 'Prachin page not available.';
                }
            } catch (error) {
                console.error('Error checking file:', error);
                document.getElementById('link-container').textContent = 'Error loading Prachin page.';
            }
        }

        // Function ko call karein
        checkFileExists();
    </script>
</body>
</html>
