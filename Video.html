<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Channel Videos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            color: #333;
        }
        .video {
            margin: 20px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .video img {
            max-width: 100%;
            height: auto;
        }
        .channel {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>YouTube Channel Videos</h1>
    <div id="video-container"></div>

    <script>
        // YouTube Channel RSS Feed URL
        const channelIds = [
            'UC5fXdqPu6-ewYPVV7JlHjkQ', // Channel 1
            'UCFo8q8WIrDifqtFHAvmr0NQ'  // Channel 2
        ];

        // Fetch Videos from YouTube RSS Feed
        function fetchVideos(channelId) {
            const rssUrl = `https://www.youtube.com/feeds/videos.xml?channel_id=${channelId}`;
            
            fetch(rssUrl)
                .then(response => response.text())
                .then(str => new window.DOMParser().parseFromString(str, "text/xml"))
                .then(data => {
                    const videoContainer = document.getElementById('video-container');
                    const channelDiv = document.createElement('div');
                    channelDiv.classList.add('channel');
                    channelDiv.innerHTML = `<h2>Channel: ${channelId}</h2>`;
                    videoContainer.appendChild(channelDiv);

                    const entries = data.getElementsByTagName('entry');
                    for (let i = 0; i < entries.length; i++) {
                        const title = entries[i].getElementsByTagName('title')[0].textContent;
                        const videoId = entries[i].getElementsByTagName('yt:videoId')[0].textContent;
                        const thumbnail = entries[i].getElementsByTagName('media:thumbnail')[0].getAttribute('url');

                        const videoElement = document.createElement('div');
                        videoElement.classList.add('video');
                        videoElement.innerHTML = `
                            <h3>${title}</h3>
                            <a href="https://www.youtube.com/watch?v=${videoId}" target="_blank">
                                <img src="${thumbnail}" alt="${title}">
                            </a>
                        `;
                        channelDiv.appendChild(videoElement);
                    }
                })
                .catch(err => console.error('Error fetching videos:', err));
        }

        // Fetch videos for each channel
        channelIds.forEach(channelId => fetchVideos(channelId));
    </script>
</body>
</html>
