<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Videos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        h1 {
            text-align: center;
            margin-top: 20px;
        }
        .video-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            padding: 20px;
        }
        .video {
            margin: 20px;
            width: 300px;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 8px;
            overflow: hidden;
        }
        .iframe-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
        }
        .iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .title {
            text-align: center;
            padding: 10px;
        }
    </style>
</head>
<body>

<h1>YouTube Videos</h1>
<div class="video-container" id="videoContainer">Loading videos...</div>

<script>
    async function loadVideos() {
        const response = await fetch('/videos');
        const videos = await response.json();
        const videoContainer = document.getElementById('videoContainer');
        videoContainer.innerHTML = ''; // Clear current content

        videos.forEach(video => {
            const videoDiv = document.createElement('div');
            videoDiv.className = 'video';
            videoDiv.innerHTML = `
                <div class="iframe-container">
                    <iframe src="https://www.youtube.com/embed/${video.videoId}" frameborder="0" allowfullscreen></iframe>
                </div>
                <div class="title">${video.title}</div>
            `;
            videoContainer.appendChild(videoDiv);
        });

        if (videos.length === 0) {
            videoContainer.innerHTML = 'No videos found.';
        }
    }

    // Load videos on page load
    loadVideos();
</script>

</body>
</html>
