
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Kaise Karen (How-To Guides) | GK Learn Study</title>
    <meta name="description" content="Explore practical, step-by-step 'how-to' guides on a variety of topics including technology, education, and daily life skills from GK Learn Study." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/notification.css">
    <style>
        /* Embedded CSS for Kaise Karen page */
        .page-hero {
            text-align: center;
            padding: 3rem 1rem;
            background: linear-gradient(135deg, color-mix(in srgb, var(--accent-color) 8%, var(--card-bg)), var(--card-bg));
            border-radius: var(--border-radius);
            margin-bottom: 2rem;
            border: 1px solid var(--border-color);
        }

        .page-hero h1 {
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0 0 0.5rem 0;
        }

        .page-hero p {
            font-size: 1.1rem;
            color: var(--text-secondary);
            max-width: 700px;
            margin: 0 auto;
        }

        .guide-filter-container {
            margin-bottom: 2.5rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        #guide-filter-input {
            width: 100%;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            border-radius: 25px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-primary);
            box-shadow: var(--card-shadow);
            transition: box-shadow .2s ease, border-color .2s ease;
            box-sizing: border-box;
        }

        #guide-filter-input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px var(--blue-transparent-focus);
        }

        .guides-grid {
            display: grid;
            gap: 2rem;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        }

        .guide-card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--card-shadow);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .guide-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px var(--shadow-color);
        }

        .guide-card-header {
            padding: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            border-bottom: 1px solid var(--border-color);
        }
        
        .guide-card-icon {
            font-size: 2.5rem;
            line-height: 1;
        }

        .guide-card-title {
            margin: 0;
            font-size: 1.3rem;
            color: var(--text-primary);
            font-weight: 600;
        }

        .guide-card-content {
            padding: 1.5rem;
            flex-grow: 1;
        }

        .guide-card-description {
            color: var(--text-secondary);
            line-height: 1.6;
            margin: 0;
        }
        
        .guide-card-footer {
            padding: 0 1.5rem 1.5rem;
            margin-top: auto;
        }

        .guide-card-link {
            display: inline-block;
            color: var(--accent-color);
            font-weight: 600;
            text-decoration: none;
        }

        .guide-card-link:hover {
            text-decoration: underline;
        }

        .no-results-message {
            text-align: center;
            grid-column: 1 / -1;
            padding: 2rem;
            color: var(--text-secondary);
        }

        @media (max-width: 768px) {
            .page-hero h1 {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>
    <header class="header" id="header">
        <nav class="navbar">
            <div class="burger" id="burger">
                <svg id="burgerSvg" width="30" height="30" viewBox="0 0 100 80" cursor="pointer">
                    <rect width="100" height="7" rx="5"></rect>
                    <rect y="30" width="100" height="7" rx="5"></rect>
                    <rect y="60" width="100" height="7" rx="5"></rect>
                </svg>
            </div>
            <a href="/index.html" class="brand" aria-label="GK Learn Study">
                <svg width="40" height="40" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="150" cy="150" r="150" fill="white" />
                    <text x="50%" y="40%" font-size="85" font-weight="bold" fill="#ff4b5c" text-anchor="middle">GK</text>
                    <text x="50%" y="65%" font-size="45" fill="#6a4cff" text-anchor="middle">Learn Study</text>
                </svg>
            </a>
            <div class="menu" id="menu">
                <div class="mobile-menu-header"><a href="/" class="menu-brand-text">GK Learn Study</a><button class="close-menu-btn" id="closeMenuBtn" aria-label="Close menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button></div>
                <div class="menu-inner"></div>
            </div>
            <div class="header-actions">
                <button class="theme-switcher" id="themeSwitcher" aria-label="Toggle theme"><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg></button>
            </div>
        </nav>
    </header>

    <main class="container">
        <div class="page-hero">
            <h1>Kaise Karen (How-To Guides)</h1>
            <p>Your complete resource for practical, step-by-step guides. Master new skills and solve common problems efficiently.</p>
        </div>
        
        <div class="guide-filter-container">
            <input type="text" id="guide-filter-input" placeholder="Filter guides by title or category..." aria-label="Filter guides">
        </div>

        <div id="guides-grid" class="guides-grid">
            <div class="spinner" style="border:4px solid var(--spinner-border);width:36px;height:36px;border-radius:50%;border-left-color:var(--primary-color);margin:20px auto;animation:spin 1s ease infinite; grid-column: 1 / -1;"></div>
        </div>
    </main>

    <footer class="app-footer">
        <div class="footer-content"></div>
        <div class="footer-bottom">
            &copy; 2024 GK Learn Study | All Rights Reserved
        </div>
    </footer>

    <script src="/js/theme.js" defer></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const guides = [
                {
                    title: 'How to Use VLOOKUP in Excel',
                    description: 'Master one of Excel\\\'s most powerful functions to look up data in tables. This guide covers syntax, examples, and common errors.',
                    category: 'Excel',
                    icon: '📊',
                    url: '/kaise-karen/vlookup-in-excel.html'
                },
                {
                    title: 'How to Write a Formal Letter',
                    description: 'Learn the correct format, tone, and etiquette for writing professional letters for job applications, official requests, and more.',
                    category: 'Writing',
                    icon: '✍️',
                    url: '/kaise-karen/how-to-write-formal-letter.html'
                },
                {
                    title: 'How to Prepare for a Job Interview',
                    description: 'Build confidence and make a great impression. This guide covers researching the company, practicing common questions, and follow-up etiquette.',
                    category: 'Career',
                    icon: '👔',
                    url: '/kaise-karen/interview-preparation-guide.html'
                },
                {
                    title: 'How to Stay Safe Online',
                    description: 'Learn essential tips for protecting your personal information online, including creating strong passwords and recognizing phishing scams.',
                    category: 'Technology',
                    icon: '🔒',
                    url: '/kaise-karen/online-safety-tips.html'
                },
                {
                    title: 'How to Calculate Percentages Easily',
                    description: 'A practical guide to calculating percentages for discounts, tips, markups, and more, with simple formulas and examples.',
                    category: 'Maths',
                    icon: '🧮',
                    url: '#' // Placeholder link
                },
                {
                    title: 'How to Create a Pivot Table in Excel',
                    description: 'Unlock the power of data analysis by learning how to create and use Pivot Tables to summarize, group, and analyze your data.',
                    category: 'Excel',
                    icon: '📈',
                    url: '#' // Placeholder link
                }
            ];

            const grid = document.getElementById('guides-grid');
            const filterInput = document.getElementById('guide-filter-input');

            function renderGuides(guidesToRender) {
                grid.innerHTML = '';
                if (guidesToRender.length === 0) {
                    grid.innerHTML = '<p class="no-results-message">No guides found matching your search.</p>';
                    return;
                }

                guidesToRender.forEach(guide => {
                    const card = document.createElement('a');
                    card.href = guide.url;
                    card.className = 'guide-card';
                    card.setAttribute('data-category', guide.category);
                    
                    card.innerHTML = `
                        <div class="guide-card-header">
                            <span class="guide-card-icon">${guide.icon}</span>
                            <h3 class="guide-card-title">${guide.title}</h3>
                        </div>
                        <div class="guide-card-content">
                            <p class="guide-card-description">${guide.description}</p>
                        </div>
                        <div class="guide-card-footer">
                           <span class="guide-card-link">Read Guide →</span>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }
            
            function filterGuides() {
                const query = filterInput.value.toLowerCase().trim();
                const filtered = guides.filter(guide => 
                    guide.title.toLowerCase().includes(query) || 
                    guide.description.toLowerCase().includes(query) ||
                    guide.category.toLowerCase().includes(query)
                );
                renderGuides(filtered);
            }

            filterInput.addEventListener('input', filterGuides);
            
            // Initial render
            renderGuides(guides);
        });
    </script>
</body>
</html>
