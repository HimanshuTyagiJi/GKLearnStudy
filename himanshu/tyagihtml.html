<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar Testing Page - GK Learn Study</title>
    <link rel="stylesheet" href="https://gklearnstudy.in/css/theme.css">
    <link rel="stylesheet" href="https://gklearnstudy.in/css/topic-menu.css">
    <style>
        .test-controls {
            margin: 100px auto 20px;
            max-width: 800px;
            padding: 20px;
            background: #f0f4f8;
            border-radius: 12px;
            border: 2px solid #2271b1;
            text-align: center;
        }
        .debug-info {
            margin: 20px auto;
            max-width: 800px;
            padding: 15px;
            background: #1e1e1e;
            color: #0f0;
            font-family: monospace;
            border-radius: 8px;
            white-space: pre-wrap;
            text-align: left;
            font-size: 0.9rem;
        }
        .btn-test {
            padding: 10px 20px;
            background: #2271b1;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header class="header">
        <nav class="navbar">
            <a href="#" class="brand">GK Testing Center</a>
        </nav>
    </header>

    <div id="sidebar-overlay"></div>
    <aside id="topic-sidebar" style="transform: translateX(0); display: block;">
        <h3 class="sidebar-title">TEST MENU</h3>
        <nav id="topic-nav">
            <ul id="test-list-ul">
                <li><a href="#">Loading...</a></li>
            </ul>
        </nav>
    </aside>

    <main class="container">
        <div class="test-controls">
            <h2>Sidebar Debugger</h2>
            <p>यह पेज चेक करेगा कि आपके <b>data/topic-menu.json</b> में क्या डेटा है और वह साइडबार में क्यों नहीं आ रहा।</p>
            <div style="margin: 15px 0;">
                <label>Test Folder Name:</label>
                <input type="text" id="folder-to-test" value="himanshu" style="padding: 8px; border-radius: 4px; border: 1px solid #ccc;">
                <button class="btn-test" onclick="runSidebarTest()">Run Test Now</button>
            </div>
        </div>

        <div class="debug-info" id="debug-log">Debug info will appear here...</div>
    </main>

    <script>
        async function runSidebarTest() {
            const logEl = document.getElementById('debug-log');
            const listUl = document.getElementById('test-list-ul');
            const folderName = document.getElementById('folder-to-test').value.trim();
            const currentPath = window.location.pathname;

            logEl.textContent = `Starting Test...\nTarget Folder: ${folderName}\nLocal Path: ${currentPath}\n`;

            try {
                logEl.textContent += `Fetching: /data/topic-menu.json?v=${Date.now()}\n`;
                const res = await fetch('/data/topic-menu.json?v=' + Date.now());
                
                if (!res.ok) {
                    throw new Error(`Fetch Failed! Status: ${res.status}`);
                }

                const data = await res.json();
                logEl.textContent += `JSON Data Received Successfully.\n`;
                logEl.textContent += `Full Data: ${JSON.stringify(data, null, 2)}\n`;

                const links = data[folderName] || [];
                logEl.textContent += `Links found for '${folderName}': ${links.length}\n`;

                listUl.innerHTML = '';

                if (links.length === 0) {
                    listUl.innerHTML = '<li><a href="#">No links in this folder</a></li>';
                    logEl.textContent += `Warning: No links found for category '${folderName}'\n`;
                } else {
                    links.forEach(item => {
                        const li = document.createElement('li');
                        // Check for match
                        const isMatch = currentPath.endsWith(item.url) || currentPath === item.url;
                        const activeClass = isMatch ? 'class="active"' : '';
                        
                        li.innerHTML = `<a href="${item.url}" ${activeClass}>${item.title}</a>`;
                        listUl.appendChild(li);
                        logEl.textContent += `Added: ${item.title} -> ${item.url} ${isMatch ? '[ACTIVE]' : ''}\n`;
                    });
                    
                    const titleEl = document.querySelector('.sidebar-title');
                    if(titleEl) titleEl.textContent = folderName.toUpperCase();
                }

                logEl.textContent += `\nTest Finished. Check the sidebar on the left.`;

            } catch (e) {
                logEl.textContent += `\nERROR: ${e.message}`;
                logEl.style.color = 'red';
            }
        }

        // Run automatically on load
        window.onload = runSidebarTest;
    </script>
</body>
</html>
