<script>
    (async function() {
        const sidebar = document.getElementById("topic-sidebar");
        const toggleBtn = document.getElementById("topic-sidebar-toggle");
        const ul = document.querySelector("#topic-nav ul");
        if (!sidebar || !ul) return;
        if (ul.children.length > 0) return;
        const canonical = document.querySelector('link[rel="canonical"]')?.href;
        let folder = "General";
        if (canonical) {
            try {
                const path = new URL(canonical).pathname;
                const segments = path.split('/').filter(s => s.length > 0);
                if (segments.length > 0 && !segments[0].endsWith('.html')) {
                    folder = segments[0];
                }
            } catch(e) {}
        }
        try {
            const res = await fetch('https://gklearnstudy.in/data/topic-menu.json?v=' + Date.now());
            const data = await res.json();
            const key = Object.keys(data).find(k => k.toLowerCase() === folder.toLowerCase());
            const links = key ? data[key] : [];
            if (links.length >= 2) {
                ul.innerHTML = links.map(item => `<li><a href="${item.url}">${item.title}</a></li>`).join('');
                const title = document.querySelector(".sidebar-title");
                if (title) title.innerText = key.toUpperCase();
                sidebar.style.display = ""; 
                if(toggleBtn) toggleBtn.style.display = "";
            } else {
                sidebar.style.display = "none";
                if(toggleBtn) toggleBtn.style.display = "none";
            }
        } catch (e) { 
            sidebar.style.display = "none";
            if(toggleBtn) toggleBtn.style.display = "none";
        }
    })();
</script>
