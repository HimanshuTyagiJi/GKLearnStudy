  <script>
        const apiKey = 'AIzaSyA-szOWO69y0eYSvxAsX9-rESUfs2n85qA';
        const channelIds = ['UC5fXdqPu6-ewYPVV7JlHjkQ', 'UCFo8q8WIrDifqtFHAvmr0NQ'];

        let nextPageToken = { all: '', shorts: '', long: '', playlists: '' };

        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
                this.classList.add('active');
                document.getElementById(this.dataset.tab).classList.add('active');
            });
        });

        function fetchVideos(category, pageToken = '') {
            const requests = channelIds.map(channelId => {
                let url = '';
                if (category === 'shorts') {
                    url = `https://www.googleapis.com/youtube/v3/search?key=${apiKey}&channelId=${channelId}&part=snippet,id&order=date&type=video&videoDuration=short&maxResults=50&pageToken=${pageToken}`;
                } else if (category === 'long') {
                    url = `https://www.googleapis.com/youtube/v3/search?key=${apiKey}&channelId=${channelId}&part=snippet,id&order=date&type=video&videoDuration=long&maxResults=50&pageToken=${pageToken}`;
                } else if (category === 'playlists') {
                    url = `https://www.googleapis.com/youtube/v3/playlists?key=${apiKey}&channelId=${channelId}&part=snippet&maxResults=50&pageToken=${pageToken}`;
                } else if (category === 'all') {
                    url = `https://www.googleapis.com/youtube/v3/search?key=${apiKey}&channelId=${channelId}&part=snippet,id&order=date&type=video&maxResults=50&pageToken=${pageToken}`;
                }

                return fetch(url).then(response => response.json());
            });

            Promise.all(requests)
                .then(responses => {
                    const videoList = document.getElementById(category + '-list');
                    const videos = [];

                    responses.forEach(data => {
                        data.items.forEach(video => {
                            const videoId = video.id.videoId;
                            const title = video.snippet.title;
                            const thumbnail = video.snippet.thumbnails.high.url;
                            const uploadDate = new Date(video.snippet.publishedAt).getTime();

                            videos.push({ videoId, title, thumbnail, uploadDate });
                        });
                    });

                    // Sort videos by upload date
                    videos.sort((a, b) => b.uploadDate - a.uploadDate);

                    // Clear previous video list
                    videoList.innerHTML = '';

                    // Append sorted videos to the list
                    videos.forEach(video => {
                        const videoElement = document.createElement('div');
                        videoElement.classList.add('video');
                        videoElement.innerHTML = `
                            <iframe src="https://www.youtube.com/embed/${video.videoId}" frameborder="0" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                            <div class="video-info">
                                <h3>${video.title}</h3>
                            </div>
                        `;
                        videoList.appendChild(videoElement);
                    });

                    const nextPageTokenVar = category + 'NextPageToken';
                    window[nextPageTokenVar] = responses[0].nextPageToken || '';
                    const loadMoreButton = document.getElementById('load-more-' + category);
                    if (window[nextPageTokenVar]) {
                        loadMoreButton.style.display = 'block';
                    } else {
                        loadMoreButton.style.display = 'none';
                    }
                })
                .catch(error => {
                    console.error('Error fetching videos:', error);
                    window.location.href = 'videos.html';  // Redirect to fallback page
                });
        }

        document.getElementById('load-more-shorts').addEventListener('click', () => {
            fetchVideos('shorts', nextPageToken.shorts);
        });

        document.getElementById('load-more-long').addEventListener('click', () => {
            fetchVideos('long', nextPageToken.long);
        });

        document.getElementById('load-more-playlists').addEventListener('click', () => {
            fetchVideos('playlists', nextPageToken.playlists);
        });

        document.getElementById('load-more-all').addEventListener('click', () => {
            fetchVideos('all', nextPageToken.all);
        });

        function searchVideos() {
            const query = document.getElementById('search-query').value.toLowerCase();
            const allVideos = [...document.querySelectorAll('.video')];
            allVideos.forEach(video => {
                const title = video.querySelector('.video-info h3').innerText.toLowerCase();
                video.style.display = title.includes(query) ? 'block' : 'none';
            });
        }

        // Fetch initial videos for all categories
        fetchVideos('all');
        fetchVideos('shorts');
        fetchVideos('long');
        fetchVideos('playlists');
    </script><hr>
