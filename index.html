               <script>
           let urls = [];
let currentPage = 0;
const itemsPerPage = 30;

// Fetch and parse the XML
function fetchData() {
    fetch('https://gklearnstudy.in/searchsitemap.xml')
        .then(response => {
            if (!response.ok) throw new Error('Sitemap not found.');
            return response.text();
        })
        .then(str => {
            const parser = new DOMParser();
            const xml = parser.parseFromString(str, "application/xml");
            urls = Array.from(xml.getElementsByTagName("url"));
            displayData();
        })
        .catch(err => {
            console.error("Failed to fetch sitemap:", err);
            document.getElementById('data-container').innerHTML = "<p>Data not available.</p>";
        });
}

// Display data with fallback image logic
function displayData() {
    const start = currentPage * itemsPerPage;
    const end = start + itemsPerPage;
    const pageData = urls.slice(start, end);
    let htmlContent = '';

    pageData.forEach(url => {
        const loc = url.getElementsByTagName("loc")[0]?.textContent || "#";
        const title = url.getElementsByTagName("title")[0]?.textContent || "No Title";
        const description = url.getElementsByTagName("p")[0]?.textContent || "";
        const imageNode = url.getElementsByTagName("image")[0];
        const alt = imageNode?.getElementsByTagName("alt")[0]?.textContent || `${title} image`;
        const imageSrc = imageNode?.getElementsByTagName("loc")[0]?.textContent || null;

        // Handle image or fallback placeholder
        let imageHTML = '';
        if (imageSrc) {
            imageHTML = `<img class="image" src="${imageSrc}" alt="${alt}" onerror="this.replaceWith(createPlaceholder('${title}'))">`;
        } else {
            imageHTML = createPlaceholder(title).outerHTML;
        }

        htmlContent += `
        <div class="row">
            <div class="leftside">
                ${imageHTML}
            </div>
            <div class="rightside">
                <h4><a href="${loc}">${title}</a></h4>
                <p>${description}</p>
            </div>
        </div>`;
    });

    document.getElementById('data-container').innerHTML = htmlContent;

    document.getElementById('prev-button').style.display = currentPage > 0 ? 'inline-block' : 'none';
    document.getElementById('next-button').style.display = end < urls.length ? 'inline-block' : 'none';
}

// Creates the placeholder HTML element
function createPlaceholder(name) {
    const div = document.createElement("div");
    div.className = "placeholder";
    div.innerHTML = `
        <div class="emoji">📘</div>
        <div>${name.charAt(0).toUpperCase() + name.slice(1)}</div>
    `;
    return div;
}

// Pagination controls
document.getElementById('prev-button').addEventListener('click', () => {
    if (currentPage > 0) {
        currentPage--;
        displayData();
    }
});

document.getElementById('next-button').addEventListener('click', () => {
    if ((currentPage + 1) * itemsPerPage < urls.length) {
        currentPage++;
        displayData();
    }
});

// Start everything when page is ready
document.addEventListener("DOMContentLoaded", fetchData);

        </script>
