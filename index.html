    <script>
        const xmlUrl = 'searchsitemap.xml';
        const itemsPerPage = 50; 
        let currentPage = 0; 
        let urls = []; 
        fetch(xmlUrl)
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.text();
            })
            .then(data => {
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(data, "application/xml");

                urls = Array.from(xmlDoc.getElementsByTagName("url"));
                displayData(); 
            })
            .catch(error => {
                console.error('Error loading XML data:', error);
                document.getElementById('data-container').innerHTML = '<p>Error loading XML data.</p>';
            });

       function displayData() {
    const start = currentPage * itemsPerPage;
    const end = start + itemsPerPage;
    const pageData = urls.slice(start, end);
    let htmlContent = '';

    pageData.forEach(url => {
        const loc = url.getElementsByTagName("loc")[0].textContent;
        const title = url.getElementsByTagName("title")[0].textContent;
        const image = url.getElementsByTagName("image")[0].getElementsByTagName("loc")[0].textContent;
        const description = url.getElementsByTagName("p")[0].textContent;

        // Remove target="_blank"
        htmlContent += `
            <a href="${loc}">
                <div class="row">
                    <div class="leftside">
                        <img src="${image}" alt="Image" class="image">
                    </div>
                    <div class="rightside">
                        <h4>${title}</h4>
                        <p>${description}</p>
                    </div>
                </div>
            </a>
        `;
    });

    document.getElementById('data-container').innerHTML = htmlContent;

    // बटन दिखाएँ/छिपाएँ
    document.getElementById('prev-button').style.display = currentPage > 0 ? 'block' : 'none';
    document.getElementById('next-button').style.display = end < urls.length ? 'block' : 'none';
}


        // अगले पृष्ठ के लिए इवेंट लिस्नर
        document.getElementById('next-button').addEventListener('click', () => {
            currentPage++;
            displayData();
        });

        // पिछले पृष्ठ के लिए इवेंट लिस्नर
        document.getElementById('prev-button').addEventListener('click', () => {
            currentPage--;
            displayData();
        });
    </script>

   <!-- JavaScript for Dynamic PWA Icon -->
    <script>
    const defaultFaviconUrl = 'https://gklearnstudy.in/GK-Learn-Study.png';
    
    function setFavicon(url) {
        let favicon = document.querySelector("link[rel~='icon']");
        if (!favicon) {
            favicon = document.createElement("link");
            favicon.rel = "icon";
            document.head.appendChild(favicon);
        }
        favicon.href = url;
    }

    function resetFavicon() {
        setFavicon(defaultFaviconUrl);
        updateManifestIcon(defaultFaviconUrl);
    }

    function updateManifestIcon(iconUrl) {
        const manifestContent = {
            "short_name": "GK",
            "name": "GK Learn Study",
            "icons": [
                {
                    "src": iconUrl,
                    "sizes": "192x192",
                    "type": "image/png"
                },
                {
                    "src": iconUrl,
                    "sizes": "512x512",
                    "type": "image/png"
                }
            ],
            "start_url": "/",
            "display": "standalone",
            "background_color": "#ffffff",
            "theme_color": "#ffffff"
        };

        const manifestBlob = new Blob([JSON.stringify(manifestContent)], { type: 'application/json' });
        const manifestUrl = URL.createObjectURL(manifestBlob);

        const manifestLink = document.getElementById('manifest');
        manifestLink.href = manifestUrl;
    }

    function updateUserIcon(initial) {
        const canvas = document.createElement('canvas');
        canvas.width = 192;
        canvas.height = 192;
        const ctx = canvas.getContext('2d');
        
        // Draw circular background and clip it
        ctx.beginPath();
        ctx.arc(96, 96, 96, 0, Math.PI * 2, true); // Full circle
        ctx.closePath();
        ctx.clip();
        ctx.fillStyle = '#007bff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw text in the center
        ctx.font = '100px Arial';
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(initial, canvas.width / 2, canvas.height / 2);

        const newFaviconUrl = canvas.toDataURL('image/png');
        setFavicon(newFaviconUrl);
        updateManifestIcon(newFaviconUrl);
    }

    document.addEventListener('DOMContentLoaded', () => {
        const savedUser = localStorage.getItem('userLoggedIn');
        if (savedUser) {
            const initial = savedUser.charAt(0).toUpperCase();
            updateUserIcon(initial);
        } else {
            resetFavicon();
        }
    });
