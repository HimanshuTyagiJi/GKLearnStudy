
<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comments Dashboard</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="/css/theme.css">
    <style>
        .dashboard-page-section {
            margin-bottom: 2.5rem;
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            border-radius: var(--border-radius);
            box-shadow: var(--card-shadow);
        }
        .page-section-header {
            margin-top: 0;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }
        .page-section-header a {
            text-decoration: none;
            color: var(--accent-color);
        }
        .page-section-header a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header class="header" id="header">
        <nav class="navbar"><a href="/" class="brand">GK Learn Study Dashboard</a></nav>
    </header>

    <main class="container">
        <h1>All Comments</h1>
        
        <div id="auth-container">
            <div id="user-info"></div>
            <div id="login-options">
                 <button id="google-login-btn" class="btn login-provider-btn" data-original-text="Sign in to View Dashboard">
                    <svg viewBox="0 0 24 24" width="18" height="18"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path></svg>
                    <span class="btn-text">Sign in to View Dashboard</span>
                </button>
            </div>
            <button id="logout-btn" class="btn">Logout</button>
        </div>
        
        <div id="dashboard-content" style="display: none;">
            <div id="owner-view"><div class="spinner"></div></div>
            <p id="non-owner-message" class="muted" style="display: none;">Access denied. This dashboard is for the site owner only.</p>
        </div>

        <!-- Hidden form for replies -->
        <div class="comment-form-shell" id="comment-form-shell" style="display: none;">
            <form class="comment-form"><textarea placeholder="Your reply..." maxlength="1000" required></textarea><input type="hidden" name="parentId"><input type="hidden" name="pageId"><div class="form-footer"><div class="actions"><button type="submit" class="btn primary">Submit Reply</button><button type="button" class="btn" data-action="cancel-reply">Cancel</button></div></div></form>
        </div>
    </main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";
    import { getFirestore, collectionGroup, query, orderBy, onSnapshot, doc, deleteDoc, addDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyCFIKqQ5OICMZhWPtZqmgem0bEW7QpoPcw", authDomain: "appcomment.firebaseapp.com", projectId: "appcomment", storageBucket: "appcomment.firebasestorage.app", messagingSenderId: "156258808941", appId: "1:156258808941:web:04a1f7470ac43657c7fb64" };
    const OWNER_UID = "Pq5f4jTfiEOJCtXBLG0mZyyikIC2";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null, allComments = [], unsubscribe = null, activeReplyForm = null;

    const dom = {
        authContainer: document.getElementById('auth-container'),
        loginBtn: document.getElementById('google-login-btn'),
        logoutBtn: document.getElementById('logout-btn'),
        userInfo: document.getElementById('user-info'),
        dashboardContent: document.getElementById('dashboard-content'),
        ownerView: document.getElementById('owner-view'),
        nonOwnerMessage: document.getElementById('non-owner-message'),
        replyFormShell: document.getElementById('comment-form-shell')
    };

    const escapeHTML = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#x27;'})[c]);
    const fmtDate = d => d.toLocaleString();

    onAuthStateChanged(auth, user => {
        currentUser = user;
        dom.authContainer.classList.toggle('logged-in', !!user);
        dom.dashboardContent.style.display = user ? 'block' : 'none';
        if (user) {
            dom.userInfo.innerHTML = `<img src="${user.photoURL}" alt="" class="user-avatar"><span class="user-name">${escapeHTML(user.displayName)}</span>`;
            if (user.uid === OWNER_UID) {
                dom.ownerView.style.display = 'block';
                dom.nonOwnerMessage.style.display = 'none';
                if (!unsubscribe) loadAllComments();
            } else {
                dom.ownerView.style.display = 'none';
                dom.nonOwnerMessage.style.display = 'block';
                if (unsubscribe) unsubscribe();
            }
        } else {
            if (unsubscribe) unsubscribe();
            dom.ownerView.innerHTML = '<div class="spinner"></div>';
        }
    });

    dom.loginBtn.onclick = () => signInWithPopup(auth, new GoogleAuthProvider());
    dom.logoutBtn.onclick = () => signOut(auth);

    function loadAllComments() {
        const q = query(collectionGroup(db, 'comments'), orderBy('timestamp', 'desc'));
        unsubscribe = onSnapshot(q, snapshot => {
            allComments = snapshot.docs.map(d => ({ id: d.id, pageId: d.ref.parent.parent.id, ...d.data() }));
            renderDashboard();
        }, err => {
            console.error(err);
            dom.ownerView.innerHTML = `<p class="muted error">Error loading comments. Make sure Firestore indexes and security rules are correct.</p>`;
        });
    }

    function renderDashboard() {
        const grouped = allComments.reduce((acc, c) => {
            (acc[c.pageId] = acc[c.pageId] || []).push(c);
            return acc;
        }, {});
        
        dom.ownerView.innerHTML = Object.keys(grouped).sort().map(pageId => {
            const pageTitle = pageId === 'main_page' ? 'Home Page' : pageId.replace(/_/g, ' ');
            const pageUrl = pageId === 'main_page' ? '/' : `/${pageId.replace(/_/g, '/')}.html`;
            const buildTree = items => {
                const byId = {}; items.forEach(it => (it.children = [], byId[it.id] = it));
                const roots = []; items.forEach(it => it.parentId && byId[it.parentId] ? byId[it.parentId].children.push(it) : roots.push(it));
                return roots;
            };
            const flattenTree = (nodes, depth = 0) => nodes.flatMap(n => [{...n, depth}, ...flattenTree(n.children, depth + 1)]);
            const commentsHtml = flattenTree(buildTree(grouped[pageId])).map(renderNode).join('');

            return `
                <section class="dashboard-page-section">
                    <h2 class="page-section-header">On: <a href="${pageUrl}" target="_blank">${pageTitle}</a></h2>
                    ${commentsHtml}
                </section>
            `;
        }).join('') || '<p class="muted">No comments yet.</p>';
    }

    function renderNode(node) {
        const isOwner = node.uid === OWNER_UID;
        const authorName = isOwner ? 'GK Learn Study' : escapeHTML(node.name);
        const badge = isOwner ? `<span class="verified-badge" title="Owner"><svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg></span>` : '';
        const avatar = `<img src="${escapeHTML(node.photoURL)}" alt="" class="comment-avatar">`;
        return `
            <div class="comment-item" style="margin-left: ${node.depth * 20}px;" data-page-id="${node.pageId}">
                <div class="comment-header">
                    <div class="comment-author-info">${avatar}<div class="comment-author">${authorName}${badge}</div></div>
                    <div class="comment-date">${fmtDate(node.timestamp?.toDate() || new Date())}</div>
                </div>
                <div class="comment-body">${escapeHTML(node.comment).replace(/\n/g, '<br>')}</div>
                <div class="comment-actions" data-comment-id="${node.id}">
                    <button class="btn small" data-action="reply">Reply</button>
                    <button class="btn small danger" data-action="delete">Delete</button>
                </div>
                <div class="inline-reply-slot"></div>
            </div>
        `;
    }

    dom.ownerView.onclick = e => {
        const btn = e.target.closest('button[data-action]');
        if (!btn) return;
        
        const action = btn.dataset.action;
        const commentItem = btn.closest('.comment-item');
        const commentId = btn.closest('[data-comment-id]').dataset.commentId;
        const pageId = commentItem.dataset.pageId;
        const node = allComments.find(c => c.id === commentId);

        if (action === 'cancel-reply') {
            if (activeReplyForm) activeReplyForm.remove();
            activeReplyForm = null;
            return;
        }

        if (action === 'delete') {
            if (!confirm('Delete this and all replies?')) return;
            const toDelete = new Set([commentId]);
            let added;
            do {
                added = false;
                for (const c of allComments) {
                    if (c.parentId && toDelete.has(c.parentId) && !toDelete.has(c.id)) {
                        toDelete.add(c.id); added = true;
                    }
                }
            } while (added);
            toDelete.forEach(id => deleteDoc(doc(db, 'pages', pageId, 'comments', id)));
        }

        if (action === 'reply') {
            if (activeReplyForm) activeReplyForm.remove();
            const slot = commentItem.querySelector('.inline-reply-slot');
            const formShell = dom.replyFormShell.cloneNode(true);
            formShell.style.display = 'block';
            formShell.querySelector('textarea').placeholder = `Replying to ${node.name}...`;
            formShell.querySelector('input[name="parentId"]').value = commentId;
            formShell.querySelector('input[name="pageId"]').value = pageId;
            slot.appendChild(formShell);
            activeReplyForm = formShell;
            formShell.querySelector('textarea').focus();
        }
    };
    
    dom.ownerView.onsubmit = async e => {
        e.preventDefault();
        const form = e.target;
        const input = form.querySelector('textarea');
        const text = input.value.trim();
        if (!text || !currentUser) return;

        const parentId = form.querySelector('input[name="parentId"]').value;
        const pageId = form.querySelector('input[name="pageId"]').value;
        
        await addDoc(collection(db, 'pages', pageId, 'comments'), {
            name: currentUser.displayName, uid: currentUser.uid, photoURL: currentUser.photoURL,
            comment: text, timestamp: serverTimestamp(), parentId,
        });

        if (activeReplyForm) activeReplyForm.remove();
        activeReplyForm = null;
    };
</script>

</body>
</html>
