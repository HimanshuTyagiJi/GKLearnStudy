<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>All Comments Dashboard | GK Learn Study</title>
        <meta name="description" content="Manage all comments across GK Learn Study from a single dashboard. Reply, moderate, and engage with your audience efficiently." />
        <meta name="author" content="Mr. Himanshu Tyagi" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="robots" content="noindex, nofollow" />
        <link rel="icon" href="favicon.ico" sizes="any" />
        <link rel="icon" href="favicon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="https://gklearnstudy.in/favicon.ico" />
        <link rel="manifest" href="manifest.json" />
        <meta name="theme-color" content="#FFFFFF" />
        
        <link rel="stylesheet" href="css/theme.css" media="print" onload="this.media='all'">
        <link rel="stylesheet" href="css/notification.css" media="print" onload="this.media='all'">
        <noscript><link rel="stylesheet" href="css/theme.css"></noscript>
       
        <!-- Firebase SDKs - These are compatibility versions and will be used -->
        <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-messaging-compat.js"></script>

        <style>
            /* Add some basic styling for the dashboard to make comments visible and readable */
            body { font-family: Arial, sans-serif; margin: 0; background-color: var(--background-color); color: var(--text-color); }
            .container { max-width: 960px; margin: 20px auto; padding: 20px; background-color: var(--card-background); border-radius: 8px; box-shadow: var(--shadow); }
            h1, h2 { color: var(--primary-color); border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 20px; }
            .muted { color: var(--muted-text-color); }
            .firebase-comments-widget { margin-top: 20px; }

            /* Auth Container */
            #auth-container { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 20px; padding: 15px; border-radius: 8px; background-color: var(--secondary-background); box-shadow: var(--shadow-sm); }
            #auth-container.logged-in #login-options { display: none; }
            #auth-container.logged-in #logout-btn { display: block; }
            #login-options button { margin-right: 10px; }
            #logout-btn { display: none; }
            #user-info { display: none; align-items: center; font-weight: bold; }
            #auth-container.logged-in #user-info { display: flex; }
            .user-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; margin-right: 8px; }
            .user-name { color: var(--text-color); }

            /* Notification Button */
            .notification-btn { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; background-color: var(--primary-color); color: white; border: none; cursor: pointer; transition: background-color 0.2s ease; }
            .notification-btn:hover { background-color: var(--primary-dark); }
            .notification-btn svg { width: 22px; height: 22px; }
            .notification-btn .spinner-icon { animation: spin 1s linear infinite; }
            @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
            /* Default hide all icons, JS will show one */
            .notification-btn .bell-icon, .notification-btn .bell-off-icon, .notification-btn .spinner-icon { display: none; }


            /* Comments Dashboard */
            .dashboard-page-section { margin-bottom: 30px; padding: 15px; border-radius: 8px; background-color: var(--secondary-background); box-shadow: var(--shadow-sm); }
            .page-section-header { margin-top: 0; margin-bottom: 15px; font-size: 1.5em; color: var(--primary-color); }
            .page-section-header a { text-decoration: none; color: var(--primary-color); }
            .page-section-header a:hover { text-decoration: underline; }

            .comment-list-container { margin-top: 15px; }
            .comment-item { background-color: var(--background-color); border: 1px solid var(--border-color); border-radius: 6px; padding: 12px; margin-bottom: 10px; position: relative; }
            .comment-item.reply-item { margin-left: 25px; border-left: 3px solid var(--primary-color-light); background-color: var(--secondary-background); }

            .comment-header { display: flex; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
            .comment-author-info { display: flex; align-items: center; margin-right: 10px; }
            .comment-avatar { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; margin-right: 8px; }
            .comment-avatar.default-avatar { background-color: var(--primary-color); color: white; display: flex; justify-content: center; align-items: center; font-size: 0.9em; font-weight: bold; }
            .owner-avatar { border: 2px solid var(--primary-color); }
            .comment-author { font-weight: bold; color: var(--heading-color); }
            .comment-date { font-size: 0.8em; color: var(--muted-text-color); margin-left: auto; } /* Push date to right */
            .verified-badge { color: var(--success-color); margin-left: 5px; font-size: 0.9em; vertical-align: middle; }
            .verified-badge svg { fill: currentColor; width: 16px; height: 16px; vertical-align: middle; }

            .comment-body { margin-bottom: 10px; line-height: 1.6; color: var(--text-color); }
            .comment-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
            .comment-actions .btn.small { padding: 5px 10px; font-size: 0.85em; }
            .comment-actions .vote-btn { background-color: var(--secondary-background); color: var(--text-color); border: 1px solid var(--border-color); }
            .comment-actions .vote-btn:hover { background-color: var(--hover-background); }
            .comment-actions .like-btn.active { color: var(--success-color); }
            .comment-actions .dislike-btn.active { color: var(--danger-color); }
            .comment-actions .count { margin-left: 5px; font-weight: bold; }
            .comment-actions .reply-btn { background-color: var(--primary-color); color: white; border: none; }
            .comment-actions .reply-btn:hover { background-color: var(--primary-dark); }
            .comment-actions .delete-btn { background-color: var(--danger-color); color: white; border: none; }
            .comment-actions .delete-btn:hover { background-color: var(--danger-dark); }

            .inline-reply-slot { margin-top: 10px; } /* Where reply form will appear */

            /* Reply Form */
            .comment-form-shell { background-color: var(--secondary-background); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; margin-top: 15px; }
            .comment-form textarea { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 5px; resize: vertical; min-height: 80px; margin-bottom: 10px; background-color: var(--input-background); color: var(--text-color); }
            .comment-form textarea::placeholder { color: var(--muted-text-color); }
            .comment-form-footer { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
            .comment-form-char-counter { font-size: 0.8em; color: var(--muted-text-color); }
            .comment-form-actions button { margin-left: 10px; }
            
            #replying-to { font-size: 0.9em; color: var(--primary-color); margin-bottom: 10px; display: none; }
            .spinner-small { border: 2px solid #f3f3f3; border-top: 2px solid #3498db; border-radius: 50%; width: 12px; height: 12px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 5px; }

            /* Buttons */
            .btn { background-color: var(--button-background); color: var(--button-text-color); border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-size: 1em; transition: background-color 0.2s ease; }
            .btn:hover { background-color: var(--button-hover-background); }
            .btn.primary { background-color: var(--primary-color); color: white; }
            .btn.primary:hover { background-color: var(--primary-dark); }
            .btn.danger { background-color: var(--danger-color); color: white; }
            .btn.danger:hover { background-color: var(--danger-dark); }
        </style>

    </head>
    <body>
        <header class="header" id="header">
             <nav class="navbar">
                <div class="burger" id="burger">
                    <svg id="burgerSvg" width="30" height="30" viewBox="0 0 100 80" cursor="pointer">
                        <rect width="100" height="7" rx="5"></rect>
                        <rect y="30" width="100" height="7" rx="5"></rect>
                        <rect y="60" width="100" height="7" rx="5"></rect>
                    </svg>
                </div>

                <a href="index.html" class="brand" aria-label="GK Learn Study">
                    <svg width="40" height="40" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="150" cy="150" r="150" fill="white" />
                        <text x="50%" y="40%" font-size="85" font-weight="bold" fill="#ff4b5c" text-anchor="middle">GK</text>
                        <text x="50%" y="65%" font-size="45" fill="#6a4cff" text-anchor="middle">Learn Study</text>
                    </svg>
                </a>

                <div class="menu" id="menu">
                    <div class="mobile-menu-header">
                        <a href="/" class="menu-brand-text">GK Learn Study</a>
                        <button class="close-menu-btn" id="closeMenuBtn" aria-label="Close menu">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                    </div>
                    <div class="menu-inner"></div>
                </div>

                <div class="header-actions">
                    <button class="theme-switcher" id="themeSwitcher" aria-label="Toggle theme">
                        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                    </button>
                </div>
            </nav>
        </header>

        <main class="container">
            <div id="dashboard-container">
                <h1>Comments Dashboard</h1>
                <p id="dashboard-auth-prompt" class="muted">कृपया कमेंट्स देखने और मैनेज करने के लिए साइन इन करें।</p>

                <div class="firebase-comments-widget" id="custom-comment-section" style="display: none;">
                    
                    <div id="auth-container">
                        <div id="user-info"></div>
                        <!-- Notification बटन यहाँ है -->
                        <button class="notification-btn" id="notification-btn" aria-label="Toggle notifications" title="नोटिफ़िकेशन चालू/बंद करें">
                            <svg class="bell-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                            </svg>
                            <svg class="bell-off-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                                <path d="M18.63 13A17.89 17.89 0 0 1 18 8a6 6 0 0 0-6-6 6 6 0 0 0-6 6c0 7-3 9-3 9h14"></path>
                                <path d="M18 8a6 6 0 0 0-9.33-5"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                            <svg class="spinner-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
                            </svg>
                        </button>
                        <div id="login-options">
                             <button id="google-login-btn" class="btn login-provider-btn" data-original-text="Sign in with Google">
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path><path d="M1 1h22v22H1z" fill="none"></path></svg>
                                <span class="btn-text">Sign in with Google</span>
                            </button>
                        </div>
                        <button id="logout-btn" class="btn">लॉग आउट</button>
                    </div>

                    <div id="owner-view">
                        <!-- Comments will be grouped by page and injected here -->
                    </div>

                    <p id="non-owner-message" class="muted" style="display: none; margin-top: 2rem;">यह डैशबोर्ड केवल साइट एडमिनिस्ट्रेटर के लिए है।</p>

                    <!-- Reply Form Template: यह एक ही फॉर्म होगा जिसे हम 'replyToComment' पर क्लिक करने पर क्लोन और भरेंगे -->
                    <div class="comment-form-shell" id="main-form-shell" style="display: none;">
                        <form class="comment-form">
                            <div class="replying-to" id="replying-to" aria-live="polite" style="display: none;"></div>
                            <textarea id="comment-input" placeholder="आपका जवाब" maxlength="1000" required aria-label="आपका जवाब"></textarea>
                            <input type="hidden" id="parent-id" value="" />
                            <input type="hidden" id="page-id" value="" /> <!-- This will hold the pageId for the reply -->
                            <div class="comment-form-footer">
                                <div class="comment-form-char-counter">0 / 1000</div>
                                <div class="comment-form-actions">
                                    <button type="submit" class="btn primary" id="submit-button">जवाब सबमिट करें</button>
                                    <button type="button" class="btn" id="cancel-reply">कैंसिल करें</button>
                                </div>
                            </div>
                        </form>
                    </div>

                </div>

            </div>
        </main>
        
        <footer class="app-footer">
            <div class="footer-content"></div>
            <div class="footer-bottom">
                &copy; 2024 GK Learn Study | All Rights Reserved
            </div>
        </footer>

        <script src="js/theme.js" defer></script>
        <!-- आपका नया comments-dashboard.js यहाँ लोड होगा -->
        <script src="js/comments-dashboard.js" defer></script>
    </body>
</html>
