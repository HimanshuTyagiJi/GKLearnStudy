<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Global Leaderboard - GK Learn Study</title>
        <meta name="description" content="Check out the global leaderboard for all competitive exams on GK Learn Study. See the top 50 players based on average performance and track your own rank." />
        <link rel="icon" href="https://gklearnstudy.in/GK-Learn-Study.png" />
        <link rel="stylesheet" href="https://gklearnstudy.in/css/theme.css">

        <style>
            .container { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
            header { text-align: center; margin-bottom: 2rem; }
            header h1 { font-size: 2.5rem; color: var(--accent-color); }
            header h2 { font-size: 1.2rem; color: var(--text-secondary); font-weight: 400; }
            .leaderboard-section { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--border-radius); padding: 2rem; }
            .leaderboard-section h2 { text-align: center; margin-top: 0; color: var(--accent-color); }
            .leaderboard { list-style: none; padding: 0; }
            .leaderboard li { display: flex; align-items: center; padding: 1rem; border-bottom: 1px solid var(--border-color); transition: background-color .2s; }
            .leaderboard li:last-child { border-bottom: none; }
            .leaderboard li.current-user { background-color: var(--accent-color-transparent); }
            .leaderboard .rank { font-size: 1.2rem; font-weight: bold; color: var(--accent-color); min-width: 40px; }
            .leaderboard .avatar { width: 40px; height: 40px; border-radius: 50%; margin-right: 1rem; object-fit: cover; }
            .leaderboard .name { font-weight: 500; flex-grow: 1; color: var(--text-primary); }
            .leaderboard .score { font-weight: bold; color: var(--text-primary); text-align: right; min-width: 80px; }
            .spinner-container { display: flex; justify-content: center; padding: 2rem; }
            .user-rank-display { margin-top: 1.5rem; padding-top: 1.5rem; border-top: 2px dashed var(--accent-color); }
        </style>
    </head>
    <body>
        <div class="container">
            <header>
                <h1>Global Leaderboard</h1>
                <h2>Top 50 Players Across All Quizzes</h2>
            </header>
            <main>
                <section class="leaderboard-section">
                    <div id="leaderboard-container">
                        <div class="spinner-container"><div class="spinner"></div></div>
                    </div>
                </section>
            </main>
        </div>
        <script type="module" src="/js/test-page.js"></script>
    </body>
</html>
