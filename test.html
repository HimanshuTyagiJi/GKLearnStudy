        <!-- Stylesheets -->
        <link rel="stylesheet" href="https://gklearnstudy.in/css/theme.css">
        <link rel="stylesheet" href="https://gklearnstudy.in/css/notification.css">

        <style>
            body {
                background-color: var(--body-bg);
                color: var(--text-primary);
            }
            .container {
                max-width: 900px;
                margin: 2rem auto;
                padding: 0 1rem;
            }
            header { text-align: center; margin-bottom: 2rem; }
            header h1 { font-size: 2.5rem; color: var(--accent-color); }
            header h2 { font-size: 1.2rem; color: var(--text-secondary); font-weight: 400; }

            .box-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
                gap: 1.5rem;
                margin-bottom: 2rem;
            }
            .box {
                background-color: var(--card-bg);
                border: 1px solid var(--border-color);
                border-radius: var(--border-radius);
                padding: 2rem;
                text-align: center;
                transition: transform 0.2s ease, box-shadow 0.2s ease;
            }
            .box:hover {
                transform: translateY(-5px);
                box-shadow: var(--card-shadow);
            }
            .box a {
                text-decoration: none;
                color: var(--text-primary);
                font-size: 1.2rem;
                font-weight: 600;
            }
            .box a:hover { color: var(--accent-color); }

            /* Leaderboard Styles */
            .leaderboard-section {
                background-color: var(--card-bg);
                border: 1px solid var(--border-color);
                border-radius: var(--border-radius);
                padding: 2rem;
                margin-top: 3rem;
            }
            .leaderboard-section h2 { text-align: center; margin-top: 0; color: var(--accent-color); }
            .leaderboard { list-style: none; padding: 0; }
            .leaderboard li {
                display: flex;
                align-items: center;
                padding: 1rem;
                border-bottom: 1px solid var(--border-color);
            }
            .leaderboard li:last-child { border-bottom: none; }
            .leaderboard .rank { font-size: 1.2rem; font-weight: bold; color: var(--accent-color); min-width: 40px; }
            .leaderboard .avatar { width: 40px; height: 40px; border-radius: 50%; margin-right: 1rem; }
            .leaderboard .name { font-weight: 500; flex-grow: 1; }
            .leaderboard .score { font-weight: bold; color: var(--text-primary); }
            .spinner-container { display: flex; justify-content: center; padding: 2rem; }
            .spinner { border: 4px solid var(--spinner-border); width: 36px; height: 36px; border-radius: 50%; border-left-color: var(--primary-color); animation: spin 1s ease infinite; }
            @keyframes spin { to { transform: rotate(360deg); } }


            /* Modal Styles */
            .modal-overlay {
                position: fixed;
                top: 0; left: 0; right: 0; bottom: 0;
                background-color: rgba(0, 0, 0, 0.6);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 2000;
                opacity: 0;
                visibility: hidden;
                transition: opacity 0.3s ease, visibility 0.3s ease;
            }
            .modal-overlay.active { opacity: 1; visibility: visible; }
            .modal-content {
                background-color: var(--card-bg);
                padding: 2rem;
                border-radius: var(--border-radius);
                max-width: 500px;
                width: 90%;
                text-align: center;
                box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            }
            .modal-content h2 { margin-top: 0; color: var(--accent-color); }
            .modal-content p { color: var(--text-secondary); margin-bottom: 2rem; }
            .modal-actions { display: flex; gap: 1rem; justify-content: center; }
        </style>

    </head>

    <body>
        <div id="login-modal" class="modal-overlay">
            <div class="modal-content">
                <h2>टेस्ट दें!</h2>
                <p>अपना स्कोर सहेजने, अपनी प्रगति देखने और लीडरबोर्ड पर प्रतिस्पर्धा करने के लिए साइन इन करें!</p>
                <div class="modal-actions">
                    <button id="sign-in-btn" class="btn primary">गूगल से साइन-इन करें</button>
                    <button id="continue-guest-btn" class="btn">बिना लॉग-इन के जारी रखें</button>
                </div>
            </div>
        </div>
        
        <div class="container">
            <header>
                <h1>Comprehensive Test Preparation</h1>
                <h2>Prepare for Competitive Exams with Ease</h2>
            </header>

            <main>
                <div class="box-grid">
                    <div class="box">
                        <a href="https://gklearnstudy.in/hindi-test">Hindi Test Preparation</a>
                    </div>
                    <div class="box">
                        <a href="https://gklearnstudy.in/computer-test">Computer Basics Test Preparation</a>
                    </div>
                </div>
                
                <section class="leaderboard-section">
                    <h2>Weekly Top Scorers</h2>
                    <div id="leaderboard-container">
                        <div class="spinner-container"><div class="spinner"></div></div>
                    </div>
                </section>
            </main>
        </div>

        <script type="module" src="/js/test-page.js"></script>
    </body>
</html>
