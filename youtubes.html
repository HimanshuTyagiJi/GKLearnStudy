<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XML से JSON अपडेट</title>
    <style>
        #progress {
            display: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>YouTube वीडियो अपडेट करें</h1>
    <button id="updateButton">वीडियो अपडेट करें</button>
    <div id="progress">
        <p>डेटा लोड हो रहा है, कृपया प्रतीक्षा करें...<span id="percentage">0%</span></p>
        <progress value="0" max="100"></progress>
    </div>

    <script>
        const githubToken = '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'; // आपका GitHub टोकन
        const apiUrl = 'https://api.github.com/repos/HimanshuTyagiJi/GKLearnStudy/contents/youtube.json'; // JSON फ़ाइल का URL
        const channelIds = [
            'UCFo8q8WIrDifqtFHAvmr0NQ',
            'UC5fXdqPu6-ewYPVV7JlHjkQ'
        ];

        document.getElementById('updateButton').addEventListener('click', loadAndUpdateJSON);

        function loadAndUpdateJSON() {
            // प्रगति इंडिकेटर दिखाएं
            document.getElementById('progress').style.display = 'block';

            const xmlPromises = channelIds.map(channelId => {
                const xmlFeedUrl = `https://video.gklearnstudy.in/https://www.youtube.com/feeds/videos.xml?channel_id=${channelId}`;
                return fetch(xmlFeedUrl)
                    .then(response => response.text())
                    .then(data => {
                        const parser = new DOMParser();
                        const xml = parser.parseFromString(data, "text/xml");
                        const entries = xml.getElementsByTagName("entry");

                        const videos = Array.from(entries).map(entry => {
                            const title = entry.getElementsByTagName("title")[0].textContent;
                            const videoId = entry.getElementsByTagName("yt:videoId")[0].textContent;
                            const published = new Date(entry.getElementsByTagName("published")[0].textContent);
                            return { title, videoId, published };
                        });

                        return videos;
                    });
            });

            Promise.all(xmlPromises).then(videos => {
                // JSON फ़ाइल को अपडेट करें
                updateJSONFile(videos.flat());
            }).catch(error => {
                console.error('XML फ़ीड पढ़ने में त्रुटि:', error);
                document.getElementById('progress').style.display = 'none'; // प्रगति छिपाएँ
            });
        }

        function updateJSONFile(videos) {
            fetch(apiUrl, {
                method: 'GET',
                headers: {
                    'Authorization': `token ${githubToken}`
                }
            })
            .then(response => response.json())
            .then(data => {
                const content = atob(data.content); // बेस64 से डिकोड करें
                const existingVideos = JSON.parse(content) || [];
                const updatedVideos = [...existingVideos, ...videos];

                // JSON फ़ाइल को GitHub पर अपडेट करें
                const jsonContent = btoa(JSON.stringify(updatedVideos, null, 2));
                return fetch(apiUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${githubToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: 'Updated video list',
                        content: jsonContent,
                        sha: data.sha // फ़ाइल की मौजूदा स्थिति
                    })
                });
            })
            .then(() => {
                console.log('JSON फ़ाइल सफलतापूर्वक अपडेट की गई!');
                alert('JSON फ़ाइल सफलतापूर्वक अपडेट की गई!'); // उपयोगकर्ता को सूचित करें
            })
            .catch(error => {
                console.error('JSON फ़ाइल अपडेट करने में त्रुटि:', error);
            })
            .finally(() => {
                document.getElementById('progress').style.display = 'none'; // प्रगति छिपाएँ
            });
        }
    </script>
</body>
</html>
