<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube वीडियो अपडेटर</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        #status {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>YouTube वीडियो अपडेटर</h1>
    <button id="updateVideos">वीडियो अपडेट करें</button>
    <div id="status"></div>

    <script>
const githubToken = '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'; // GitHub टोकन
const apiUrl = 'https://api.github.com/repos/HimanshuTyagiJi/GKLearnStudy/contents/youtube.json'; // JSON फ़ाइल का URL
const xmlFeedUrl = 'https://www.youtube.com/feeds/videos.xml?channel_id=YOUR_CHANNEL_ID'; // XML फ़ीड का URL

async function fetchXMLData() {
    try {
        const response = await fetch(xmlFeedUrl);
        const data = await response.text();
        const parser = new DOMParser();
        const xml = parser.parseFromString(data, "text/xml");
        const entries = xml.getElementsByTagName("entry");

        let videos = [];
        for (let entry of entries) {
            const title = entry.getElementsByTagName("title")[0].textContent;
            const videoId = entry.getElementsByTagName("yt:videoId")[0].textContent;
            const published = new Date(entry.getElementsByTagName("published")[0].textContent);
            videos.push({ title, videoId, published });
        }

        await updateJsonFile(videos);
    } catch (error) {
        console.error('XML से डेटा लाने में त्रुटि:', error);
    }
}

async function getJsonFileSha() {
    const response = await fetch(apiUrl, {
        method: 'GET',
        headers: {
            'Authorization': `token ${githubToken}`,
            'Accept': 'application/vnd.github.v3.raw'
        }
    });

    if (response.ok) {
        const fileData = await response.json();
        const sha = fileData.sha; // SHA प्राप्त करें
        return sha;
    } else {
        console.error('JSON फ़ाइल को पढ़ने में त्रुटि:', await response.text());
        return null;
    }
}

async function updateJsonFile(videos) {
    const sha = await getJsonFileSha(); // SHA प्राप्त करें
    if (!sha) {
        console.error('SHA प्राप्त नहीं किया गया। JSON फ़ाइल को अपडेट नहीं किया जा सकेगा।');
        return;
    }

    // पहले JSON फ़ाइल को पढ़ें
    const response = await fetch(apiUrl, {
        method: 'GET',
        headers: {
            'Authorization': `token ${githubToken}`,
            'Accept': 'application/vnd.github.v3.raw'
        }
    });
    
    let existingData = await response.json();
    existingData = existingData || []; // अगर कोई डेटा नहीं है, तो खाली एरे

    // नए वीडियो जोड़ें
    videos.forEach(video => {
        if (!existingData.some(existingVideo => existingVideo.videoId === video.videoId)) {
            existingData.push(video);
        }
    });

    // JSON फ़ाइल को अपडेट करें
    const updateResponse = await fetch(apiUrl, {
        method: 'PUT',
        headers: {
            'Authorization': `token ${githubToken}`,
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            message: "Update video data",
            content: btoa(JSON.stringify(existingData)), // Base64 में एन्कोड करना
            sha: sha // SHA डालें
        })
    });

    if (updateResponse.ok) {
        console.log('JSON फ़ाइल को सफलतापूर्वक अपडेट किया गया।');
    } else {
        console.error('JSON फ़ाइल को अपडेट करने में त्रुटि:', await updateResponse.text());
    }
}

// XML डेटा लाने के लिए फ़ंक्शन कॉल करें
fetchXMLData();

    </script>
</body>
</html>
