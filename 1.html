/**
 * Calculates the Levenshtein distance between two strings.
 * Used for fuzzy search matching.
 */
function levenshteinDistance(a, b) {
  const matrix = [];
  for (let i = 0; i <= b.length; i++) matrix[i] = [i];
  for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
  for (let i = 1; i <= b.length; i++) {
    for (let j = 1; j <= a.length; j++) {
      if (b.charAt(i - 1) === a.charAt(j - 1)) {
        matrix[i][j] = matrix[i - 1][j - 1];
      } else {
        matrix[i][j] = Math.min(
          matrix[i - 1][j - 1] + 1,
          matrix[i][j - 1] + 1,
          matrix[i - 1][j] + 1
        );
      }
    }
  }
  return matrix[b.length][a.length];
}

/**
 * Manages the theme switching functionality (dark/light mode).
 */
function initTheme() {
    const themeToggle = document.getElementById('themeToggle');
    const sunIcon = document.getElementById('sunIcon');
    const moonIcon = document.getElementById('moonIcon');

    if (!themeToggle || !sunIcon || !moonIcon) return;

    const applyTheme = (theme) => {
        if (theme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            sunIcon.style.display = 'none';
            moonIcon.style.display = 'block';
        } else {
            document.documentElement.removeAttribute('data-theme');
            sunIcon.style.display = 'block';
            moonIcon.style.display = 'none';
        }
    };

    themeToggle.addEventListener('click', () => {
        let currentTheme = localStorage.getItem('theme') === 'dark' ? 'light' : 'dark';
        localStorage.setItem('theme', currentTheme);
        applyTheme(currentTheme);
    });

    // Apply saved theme on initial load
    applyTheme(localStorage.getItem('theme') || 'light');
}


/**
 * Initializes all navigation-related interactions:
 * - Burger menu toggle
 * - Overlay and back arrow closing the menu
 * - Horizontal scroll arrows for desktop menu
 * - Sets the active link based on the current URL
 */
function initNavigation() {
    const burger = document.querySelector('.burger');
    const menu = document.querySelector('.menu');
    const overlay = document.querySelector('.overlay');
    const backArrow = document.querySelector('.back-arrow');

    const toggleMenu = (isActive) => {
        menu?.classList.toggle('is-active', isActive);
        overlay?.classList.toggle('is-active', isActive);
    };

    burger?.addEventListener('click', () => toggleMenu(true));
    overlay?.addEventListener('click', () => toggleMenu(false));
    backArrow?.addEventListener('click', () => toggleMenu(false));

    // Menu arrows for horizontal scrolling on desktop
    const menuInner = document.querySelector('.menu-inner');
    const leftArrow = document.querySelector('.menu-arrow.left');
    const rightArrow = document.querySelector('.menu-arrow.right');

    if (menuInner && leftArrow && rightArrow) {
        const updateArrows = () => {
            requestAnimationFrame(() => {
                const { scrollWidth, clientWidth, scrollLeft } = menuInner;
                leftArrow.style.visibility = scrollLeft > 0 ? 'visible' : 'hidden';
                rightArrow.style.visibility = scrollWidth > clientWidth + scrollLeft ? 'visible' : 'hidden';
            });
        };

        leftArrow.addEventListener('click', () => {
            menuInner.scrollBy({ left: -200, behavior: 'smooth' });
            setTimeout(updateArrows, 300);
        });

        rightArrow.addEventListener('click', () => {
            menuInner.scrollBy({ left: 200, behavior: 'smooth' });
            setTimeout(updateArrows, 300);
        });

        menuInner.addEventListener('scroll', updateArrows);
        window.addEventListener('resize', updateArrows);
        updateArrows();
    }
    
    // Set active link
    const currentPath = window.location.pathname.toLowerCase();
    const menuLinks = document.querySelectorAll('.menu-inner a');

    menuLinks.forEach(link => {
        const linkPath = new URL(link.href).pathname.toLowerCase();
        let isActive = false;

        if ((currentPath === '/' || currentPath === '/index.html') && (linkPath === '/' || linkPath === '/index.html')) {
            isActive = true;
        } else if (linkPath !== '/' && currentPath.startsWith(linkPath.replace('.html', ''))) {
            isActive = true;
        }

        if (isActive) {
            link.classList.add('active');
        }
    });
}

/**
 * Initializes the search functionality.
 * @param {Array<Object>} data - The search data array.
 */
function initSearch(data) {
    const searchContainer = document.querySelector('.search-container');
    const searchIcon = document.getElementById('searchBtn');
    const backIcon = document.getElementById('backBtn');
    const searchInput = document.getElementById('searchInput');
    const resultsContainer = document.getElementById('results');
    
    if(!searchContainer || !searchIcon || !backIcon || !searchInput || !resultsContainer) return;

    const closeSearch = () => {
        searchContainer.classList.remove('active');
        searchInput.value = '';
        resultsContainer.innerHTML = '';
        resultsContainer.style.display = 'none';
    };

    const showResults = () => {
        const input = searchInput.value.trim().toLowerCase();
        resultsContainer.innerHTML = '';

        if (input === '') {
            resultsContainer.style.display = 'none';
            return;
        }

        const inputWords = input.split(/\s+/);

        const getMatchInfo = (item) => {
            const titleLower = item.title.toLowerCase();
            const paraLower = item.paragraph.toLowerCase();
            let exactCount = 0, partialCount = 0, fuzzyCount = 0, totalScore = 0;

            inputWords.forEach(word => {
                if (titleLower.includes(word) || paraLower.includes(word)) {
                    partialCount++;
                    totalScore += 1;
                } else {
                    const allWords = [...titleLower.split(/\s+/), ...paraLower.split(/\s+/)];
                    const maxDist = Math.max(2, Math.floor(word.length * 0.4));
                    if (allWords.some(dataWord => levenshteinDistance(word, dataWord) <= maxDist)) {
                        fuzzyCount++;
                        totalScore += 2;
                    } else {
                        totalScore += 3;
                    }
                }
            });

            return { item, exactCount, partialCount, fuzzyCount, totalScore };
        };

        const scoredData = data
            .map(getMatchInfo)
            .filter(obj => (obj.exactCount + obj.partialCount + obj.fuzzyCount) > 0);
        
        if (scoredData.length === 0) {
            resultsContainer.style.display = 'block';
            resultsContainer.innerHTML = '<p class="no-results-message">No results found.</p>';
            return;
        }

        scoredData.sort((a, b) => 
            a.totalScore - b.totalScore ||
            b.exactCount - a.exactCount ||
            b.partialCount - a.partialCount ||
            b.fuzzyCount - a.fuzzyCount ||
            a.item.title.localeCompare(b.item.title)
        );

        scoredData.forEach(({ item }) => {
            const card = document.createElement('div');
            card.className = 'result-card';
            card.onclick = () => window.location.href = item.url;
            card.innerHTML = `
                <img src="${item.image}" alt="${item.title}" class="result-image">
                <div class="result-text">
                    <h3 class="result-title">${item.title}</h3>
                    <p class="result-paragraph">${item.paragraph}</p>
                </div>
                <span class="result-arrow">→</span>
            `;
            resultsContainer.appendChild(card);
        });

        resultsContainer.style.display = 'block';
    };

    searchIcon.addEventListener('click', () => {
        searchContainer.classList.add('active');
        searchInput.focus();
    });

    backIcon.addEventListener('click', closeSearch);

    searchInput.addEventListener('input', showResults);

    document.addEventListener('click', (e) => {
        const target = e.target;
        // If the click is outside the search container and the results container, close the search.
        if (!searchContainer.contains(target) && !resultsContainer.contains(target)) {
             if (searchContainer.classList.contains('active')) {
                closeSearch();
             }
        }
    });
}

/**
 * Sets up error handling for images, replacing broken ones with a placeholder.
 */
function initImagePlaceholders() {
    document.querySelectorAll("img").forEach(img => {
        img.onerror = () => {
            const imageName = img.src.split('/').pop()?.split('.')[0] || 'image';
            const placeholder = document.createElement("div");
            placeholder.className = "placeholder";
            placeholder.innerHTML = `<div class="emoji">📘</div><div>${imageName.charAt(0).toUpperCase() + imageName.slice(1)}</div>`;
            img.replaceWith(placeholder);
        };
    });
}

/**

 */
function initLinkAttributes() {
    document.querySelectorAll('a').forEach(link => {
        if (!link.title) {
            link.title = link.textContent?.trim() || link.href;
        }
        if (link.target === '_blank') {
            link.rel = 'noopener noreferrer';
        }
    });
}
