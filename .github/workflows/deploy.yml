name: Build and Deploy GK Learn Study

on:
  push:
    branches:
      - main # या आपका main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout repo
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      # 3️⃣ Install dependencies
      - name: Install Dependencies 📦
        run: npm install

      # 4️⃣ Build search data
      - name: Build Search Data 📝
        run: node build-search-data.mjs

      # 5️⃣ Deploy to GitHub Pages
      - name: Deploy to GitHub Pages 🚀
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }} # automatic token
          publish_dir: ./dist   # अब सिर्फ dist folder deploy होगा
