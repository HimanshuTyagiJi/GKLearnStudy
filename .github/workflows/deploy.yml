
name: Build and Deploy GK Learn Study

on:
  push:
    branches:
      - main # या आपका जो भी main branch हो

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: '18' # Node.js का संस्करण

      - name: Install Dependencies 📦
        run: npm install

      - name: Build Search Data 📝
        run: node build-search-data.mjs

      - name: Deploy to GitHub Pages 🚀
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./ # पूरे फोल्डर को डिप्लॉय करें
