name: Update Search Data

# This action runs on every push to the main branch
on:
  push:
    branches:
      - main # Change this if your default branch is different (e.g., master)

jobs:
  build-and-commit:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository's code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Use a recent LTS version of Node.js
          cache: 'npm' # Cache npm dependencies for faster runs

      # Step 3: Install dependencies from package-lock.json
      - name: Install Dependencies
        run: npm ci

      # Step 4: Run the script to generate search-data.json
      - name: Generate Search Data
        run: node generate-search-data.mjs

      # Step 5: Commit and push the updated search-data.json if it has changed
      - name: Commit and Push if changed
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add search-data.json
          # Check if there are changes to commit
          if ! git diff --staged --quiet; then
            git commit -m "chore: Auto-update search data"
            git push
          else
            echo "No changes to commit."
          fi
