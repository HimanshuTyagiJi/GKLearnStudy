name: Android CI

on:
  push:
    branches:
      - main  # या तुम्हारी branch का नाम
  pull_request:
    branches:
      - main
  workflow_dispatch:  # Manually Trigger करने के लिए

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v2  # v2 को v3 में update किया

      - name: Set up Java
        uses: actions/setup-java@v2
        with:
          distribution: 'zulu'
          java-version: '17'  # तुम्हारे Android Studio के हिसाब से Java Version बदल सकते हो

      - name: Set up Android SDK
        uses: android-actions/setup-android@v2

      - name: Grant Execute Permission to Gradle
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v2
        with:
          name: app-release
          path: app/build/outputs/apk/debug/app-debug.apk
