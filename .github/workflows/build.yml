name: Android CI

on:
  push:
    branches:
      - main  # या तुम्हारी branch का नाम
  pull_request:
    branches:
      - main
  workflow_dispatch:  # Manually Trigger करने के लिए

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3  # ✅ Updated to v3

      - name: Set up Java
        uses: actions/setup-java@v3  # ✅ Updated to v3
        with:
          distribution: 'zulu'
          java-version: '17'  # तुम्हारे Android Studio के हिसाब से Java Version बदल सकते हो

      - name: Set up Android SDK
        uses: android-actions/setup-android@v2

      - name: Cache Gradle Dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant Execute Permission to Gradle
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v2  # ✅ Changed to v2 to fix errors
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v2  # ✅ Changed to v2 to fix errors
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
