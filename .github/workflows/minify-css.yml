name: Minify CSS

on:
  push:
    branches:
      - main

jobs:
  minify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Minify CSS Files
        run: |
          sudo apt-get install yui-compressor
          yui-compressor css/menu.css -o css/menu.min.css
          yui-compressor css/rightside.css -o css/rightside.min.css

      - name: Commit Changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add css/menu.min.css css/rightside.min.css
          git commit -m "Auto-Minified CSS"
          git push
