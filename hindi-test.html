<!DOCTYPE html>
<html lang="hi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>हिंदी टेस्ट | परीक्षा की तैयारी - GK Learn Study</title>
        <meta name="description" content="GK Learn Study पर हिंदी टेस्ट की तैयारी करें। मॉक टेस्ट, ऑनलाइन ट्यूटोरियल और प्रतियोगी परीक्षाओं के लिए अध्ययन सामग्री प्राप्त करें।" />
        <link rel="icon" href="https://gklearnstudy.in/GK-Learn-Study.png" type="image/png" />
        <link rel="stylesheet" href="https://gklearnstudy.in/css/theme.css" />
        <style>
            .container { max-width: 900px; }
            .box-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
            .box { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--border-radius); padding: 2rem; text-align: center; transition: transform 0.2s ease, box-shadow 0.2s ease; display: flex; flex-direction: column; justify-content: center; align-items: center; }
            .box:hover { transform: translateY(-5px); box-shadow: var(--card-shadow); }
            .box a { text-decoration: none; color: var(--text-primary); font-size: 1.2rem; font-weight: 600; }
            .box a:hover { color: var(--accent-color); }
            .leaderboard-section { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--border-radius); padding: 2rem; margin-top: 3rem; }
            .leaderboard-section h2 { text-align: center; margin-top: 0; color: var(--accent-color); }
            .leaderboard { list-style: none; padding: 0; }
            .leaderboard li { display: flex; align-items: center; padding: 1rem; border-bottom: 1px solid var(--border-color); }
            .leaderboard li:last-child { border-bottom: none; }
            .leaderboard .rank { font-size: 1.2rem; font-weight: bold; color: var(--accent-color); min-width: 40px; }
            .leaderboard .avatar { width: 40px; height: 40px; border-radius: 50%; margin-right: 1rem; object-fit: cover; }
            .leaderboard .name { font-weight: 500; flex-grow: 1; color: var(--text-primary); }
            .leaderboard .score { font-weight: bold; color: var(--text-secondary); }
            .button-group { display: flex; gap: 1rem; justify-content: center; align-items: center; margin-top: 1rem; }
            .user-score-display h4 { margin: 0 0 1rem 0; color: var(--accent-color); font-size: 1.1rem; }
        </style>
    </head>
    <body>
        <main class="container">
            <h1>Hindi Test Hub</h1>
            <p class="section-subtitle">अपनी हिंदी भाषा की দক্ষতা का परीक्षण करें। नीचे दिए गए टेस्ट भागों में से चुनें और अपनी तैयारी को मापें।</p>
            
            <div id="test-parts-container" class="box-grid">
                <div class="box" data-quiz-id="hindi-test-part-01">
                    <a href="https://gklearnstudy.in/hindi-test/part-01.html">Part-01</a>
                </div>
                <div class="box" data-quiz-id="hindi-test-part-02">
                     <a href="#">Part-02 (Coming Soon)</a>
                </div>
                 <div class="box" data-quiz-id="hindi-test-part-03">
                     <a href="#">Part-03 (Coming Soon)</a>
                </div>
            </div>

            <section class="leaderboard-section">
                <h2>Hindi Tests - Top Scorers</h2>
                <p class="section-subtitle" style="margin-bottom: 2rem;">यहां हिंदी टेस्ट के शीर्ष स्कोरर हैं। अपना सर्वश्रेष्ठ स्कोर प्राप्त करें और लीडरबोर्ड पर चढ़ें!</p>
                <div id="leaderboard-container">
                    <div class="spinner-container"><div class="spinner"></div></div>
                </div>
            </section>

        </main>
        <script type="module" src="/js/hindi-test.js"></script>
    </body>
</html>
