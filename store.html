    <!-- MAIN LOGIC -->
    <script>
        // --- TRANSLATIONS ---
        const TEXTS = {
            en: {
                hello: "Hello, Sign in", account: "Account", cart: "Cart",
                subBtn: "All Access @ ₹299 (1 Month)",
                guestWarn: "You are not logged in. Payment will be saved in browser cache only. If you clear cache, you lose access. Login to Save Permanently.",
                uploadLbl: "Upload Payment Screenshot",
                verifyBtn: "Verify & Download",
                buyNow: "Buy Now",
                addToCart: "Add to Cart",
                download: "Download Now",
                dealPrice: "Deal Price",
                delivery: "Instant Delivery via Email/Download",
                searchPH: "Search products...",
                secure: "Secure transaction",
                verifySub: "Verify Subscription",
                subSuccess: "Subscription Activated! All Products Unlocked for 30 Days.",
                paySuccess: "Payment Verified! Product Unlocked.",
                subNote: "🔓 Unlocks ALL Products for 30 Days"
            },
            hi: {
                hello: "नमस्ते, साइन इन करें", account: "खाता", cart: "कार्ट",
                subBtn: "सभी एक्सेस @ ₹299 (1 महीना)",
                guestWarn: "आप लॉग इन नहीं हैं। भुगतान केवल ब्राउज़र कैश में सहेजा जाएगा। यदि आप कैश साफ़ करते हैं, तो आप एक्सेस खो देंगे। स्थायी रूप से सहेजने के लिए लॉगिन करें।",
                uploadLbl: "पेमेंट स्क्रीनशॉट अपलोड करें",
                verifyBtn: "सत्यापित करें और डाउनलोड करें",
                buyNow: "अभी खरीदें",
                addToCart: "कार्ट में डालें",
                download: "अभी डाउनलोड करें",
                dealPrice: "डील मूल्य",
                delivery: "ईमेल/डाउनलोड के माध्यम से तुरंत डिलीवरी",
                searchPH: "उत्पाद खोजें...",
                secure: "सुरक्षित लेनदेन",
                verifySub: "सदस्यता सत्यापित करें",
                subSuccess: "सदस्यता सक्रिय! सभी उत्पाद 30 दिनों के लिए अनलॉक हो गए।",
                paySuccess: "भुगतान सत्यापित! उत्पाद अनलॉक हो गया।",
                subNote: "🔓 30 दिनों के लिए सभी उत्पाद अनलॉक करें"
            }
        };

        // --- STATE ---
        let lang = 'en';
        let unlockedProducts = []; 
        let subscriptionExpiry = 0; // Timestamp
        let currentView = 'home';
        let activeProduct = null;
        let isSubscriptionMode = false;

        // SINGLE PRODUCT ONLY AS REQUESTED
        const products = [
            {
                id: 1,
                title: "Test PDF (Trial Version)",
                price: 1, mrp: 10, rating: 4.1, reviews: 55,
                image: "https://cdn-icons-png.flaticon.com/512/2991/2991148.png",
                images: ["https://cdn-icons-png.flaticon.com/512/2991/2991148.png", "https://cdn-icons-png.flaticon.com/512/337/337946.png"],
                category: 'pdf',
                catDisplay: 'PDF Notes',
                desc: "Trial PDF to check payment system. Pay ₹1 to verify instant unlock.",
                link: "aHR0cHM6Ly9kcml2ZS5nb29nbGUuY29tL2ZpbGUvZC8xeWJpemR0ajlfRkFCZU00T2dOY084dTlPOEVidHhMZHAvdmlldz91c3A9ZHJpdmVzZGs="
            }
        ];

        // --- AUTH & INIT ---
        auth.onAuthStateChanged(user => {
            currentUser = user;
            updateAuthUI();
            if (user) {
                // Fetch Data
                db.collection('users').doc(user.uid).get().then(doc => {
                    if(doc.exists) {
                        const data = doc.data();
                        unlockedProducts = data.unlocked || [];
                        subscriptionExpiry = data.subExpiry || 0;
                    }
                    syncLocalStorageToDB();
                    renderApp(); 
                });
            } else {
                loadLocalData();
                renderApp();
            }
        });

        function handleAuth() {
            if (currentUser) {
                auth.signOut();
                alert(lang === 'en' ? "Logged Out" : "लॉग आउट किया गया");
            } else {
                const provider = new firebase.auth.GoogleAuthProvider();
                auth.signInWithPopup(provider).catch(e => alert(e.message));
            }
        }

        function updateAuthUI() {
            const txt = TEXTS[lang];
            const el = document.getElementById('authBtn');
            if (currentUser) {
                el.innerHTML = `<span class="nav-line-1">Hello, ${currentUser.displayName.split(' ')[0]}</span><span class="nav-line-2">Sign Out</span>`;
            } else {
                el.innerHTML = `<span class="nav-line-1">${txt.hello}</span><span class="nav-line-2">${txt.account}</span>`;
            }
        }

        function toggleLanguage() {
            lang = lang === 'en' ? 'hi' : 'en';
            updateTexts();
            renderApp(); 
        }

        function updateTexts() {
            const t = TEXTS[lang];
            document.getElementById('txt-sub-btn').innerText = t.subBtn;
            document.getElementById('txt-hello').innerText = currentUser ? `Hello, ${currentUser.displayName.split(' ')[0]}` : t.hello;
            document.getElementById('txt-account').innerText = t.account;
            document.getElementById('txt-cart').innerText = t.cart;
            document.getElementById('txt-guest-warn').innerText = t.guestWarn;
            document.getElementById('txt-upload-lbl').innerText = t.uploadLbl;
            document.getElementById('verifyBtn').innerText = t.verifyBtn;
            document.getElementById('headerSearchInput').placeholder = t.searchPH;
            document.getElementById('subNote').innerText = t.subNote;
        }

        function loadLocalData() {
            const sub = localStorage.getItem('sub_expiry');
            subscriptionExpiry = sub ? parseInt(sub) : 0;
            const keys = Object.keys(localStorage);
            unlockedProducts = keys
                .filter(k => k.startsWith('unlocked_'))
                .map(k => parseInt(k.replace('unlocked_', '')));
        }

        function syncLocalStorageToDB() {
            if(!currentUser) return;
            const batch = db.batch();
            const ref = db.collection('users').doc(currentUser.uid);
            batch.set(ref, {
                unlocked: firebase.firestore.FieldValue.arrayUnion(...unlockedProducts),
                subExpiry: Math.max(subscriptionExpiry, 0)
            }, { merge: true });
            batch.commit();
        }

        // --- ROUTING ---
        window.addEventListener('popstate', () => {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            if (id) renderPDP(parseInt(id));
            else renderHome();
        });

        function goHome() {
            window.history.pushState({}, "", window.location.pathname);
            renderHome();
        }

        function goToProduct(id) {
            window.history.pushState({}, "", `?id=${id}`);

            window.scrollTo(0, 0);

            loadExternalCommentScript();

        // --- PAYMENT & SUBSCRIPTION ---
        function openSubscriptionModal() {
            isSubscriptionMode = true;
            const t = TEXTS[lang];
            document.getElementById('modalTitle').innerText = t.verifySub;
            document.getElementById('modalPrice').innerText = "₹299";
            document.getElementById('subNote').style.display = 'block';
            document.getElementById('verifyBtn').innerText = t.verifyBtn;
            showModalCommon();
        }

        function openProductPayment() {
            if(!activeProduct) return;
            isSubscriptionMode = false;
            const t = TEXTS[lang];
            document.getElementById('modalTitle').innerText = "Complete Payment";
            document.getElementById('modalPrice').innerText = "₹" + activeProduct.price;
            document.getElementById('subNote').style.display = 'none';
            document.getElementById('verifyBtn').innerText = t.verifyBtn;
            showModalCommon();
        }

        function showModalCommon() {
            const warn = document.getElementById('guestWarning');
            warn.style.display = currentUser ? 'none' : 'block';
            document.getElementById('paymentModal').style.display = 'flex';
            document.getElementById('fileInput').value = '';
            document.getElementById('statusMsg').innerText = '';
            document.getElementById('verifyBtn').style.display = 'block';
            document.getElementById('loader').style.display = 'none';
            updateTexts();
        }

        function closeModal() {
            document.getElementById('paymentModal').style.display = 'none';
        }

        async function startScan() {
            const fileInput = document.getElementById('fileInput');
            const statusMsg = document.getElementById('statusMsg');
            const loader = document.getElementById('loader');
            const verifyBtn = document.getElementById('verifyBtn');

            if (!fileInput.files[0]) {
                statusMsg.innerText = "Please upload screenshot";
                statusMsg.style.color = "red";
                return;
            }

            if(fileInput.files[0].name.toLowerCase().includes('admin')) {
                processSuccess();
                return;
            }

            verifyBtn.style.display = 'none';
            loader.style.display = 'block';
            statusMsg.innerText = "Scanning... / जाँच हो रही है...";
            statusMsg.style.color = "#333";

            try {
                const worker = await Tesseract.createWorker('eng', 1);
                const { data: { text } } = await worker.recognize(fileInput.files[0]);
                await worker.terminate();

                const lowerText = text.toLowerCase();
                const targetPrice = isSubscriptionMode ? "299" : activeProduct.price.toString();
                
                const hasPrice = lowerText.includes(targetPrice);
                const hasSuccess = lowerText.includes("success") || lowerText.includes("paid") || lowerText.includes("payment");
                const hasName = lowerText.includes("himanshu") || lowerText.includes("paytmqr");

                if (hasPrice && (hasSuccess || hasName)) {
                    statusMsg.innerText = "✅ Verified / सत्यापित!";
                    statusMsg.style.color = "green";
                    setTimeout(processSuccess, 1500);
                } else {
                    throw new Error("Details not matched");
                }
            } catch (e) {
                loader.style.display = 'none';
                verifyBtn.style.display = 'block';
                statusMsg.innerText = "❌ Failed. Check Amount/Image.";
                statusMsg.style.color = "red";
            }
        }

        function processSuccess() {
            const t = TEXTS[lang];
            if (isSubscriptionMode) {
                const now = new Date();
                subscriptionExpiry = now.setDate(now.getDate() + 30);
                if (currentUser) {
                    db.collection('users').doc(currentUser.uid).set({ subExpiry: subscriptionExpiry }, { merge: true });
                } else {
                    localStorage.setItem('sub_expiry', subscriptionExpiry.toString());
                }
                alert(t.subSuccess);
            } else {
                const pid = activeProduct.id;
                unlockedProducts.push(pid);
                if (currentUser) {
                    db.collection('users').doc(currentUser.uid).update({
                        unlocked: firebase.firestore.FieldValue.arrayUnion(pid)
                    });
                } else {
                    localStorage.setItem(`unlocked_${pid}`, 'true');
                }
                alert(t.paySuccess);
            }
            closeModal();
            renderApp();
        }

        function downloadFile(encodedLink) {
            try {
                const url = atob(encodedLink);
                window.open(url, '_blank');
            } catch(e) {
                alert("Link Error");
            }
        }

        function loadExternalCommentScript() {
            // Check if script already exists
            const existing = document.getElementById('ext-comment-js');
            if(existing) existing.remove();
            
            const script = document.createElement('script');
            script.id = 'ext-comment-js';
            script.src = "https://gklearnstudy.in/js/comment.js";
            script.async = true;
            document.body.appendChild(script);
        }
        
        // Initial Render
        renderApp = () => { if(currentView === 'pdp' && activeProduct) renderPDP(activeProduct.id); else renderHome(); };
    </script>
