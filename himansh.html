    <style>
        :root {
            --primary-color: #4a90e2;
            --primary-hover: #357ABD;
            --background-color-solver: #f0f2f5;
            --container-bg-solver: var(--card-bg);
            --text-color-solver: var(--text-primary);
            --border-color-solver: var(--border-color);
            --shadow-color-solver: var(--shadow-color);
            --error-color: #e53935;
        }

        .calculator-container {
            width: 100%;
            max-width: 800px;
            background-color: var(--container-bg-solver);
            border-radius: 12px;
            box-shadow: 0 4px 12px var(--shadow-color-solver);
            padding: 2rem;
            margin: 2rem auto;
            border: 1px solid var(--border-color-solver);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .calculator-container h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 1.5rem;
            font-size: 2rem;
        }

        #ai-solver-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        #question-input {
            width: 100%;
            min-height: 100px;
            padding: 0.75rem;
            font-size: 1rem;
            font-family: inherit;
            border: 1px solid var(--border-color-solver);
            border-radius: 8px;
            resize: vertical;
            transition: border-color 0.2s, box-shadow 0.2s;
            background-color: var(--input-bg);
            color: var(--text-color-solver);
        }

        #question-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.2);
        }

        #solve-button {
            padding: 0.75rem 1.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
            background-color: var(--primary-color);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        #solve-button:hover:not(:disabled) { background-color: var(--primary-hover); }
        #solve-button:disabled { background-color: #a0c7f1; cursor: not-allowed; }

        .solution-container {
            margin-top: 2rem;
            border-top: 1px solid var(--border-color-solver);
            padding-top: 2rem;
        }

        .solution-container h2 {
            margin-bottom: 1rem;
            font-size: 1.5rem;
            color: var(--text-color-solver);
        }

        #solution-output {
            background-color: var(--input-bg);
            border-radius: 8px;
            padding: 1.5rem;
            min-height: 100px;
            overflow-wrap: break-word;
            line-height: 1.7;
            border: 1px solid var(--border-color-solver);
            color: var(--text-color-solver);
        }
        
        #solution-output p { margin-bottom: 1rem; }
        #solution-output p:last-child { margin-bottom: 0; }

        #solution-output sup { font-size: 0.8em; vertical-align: super; }
        #solution-output sub { font-size: 0.8em; vertical-align: sub; }
        #solution-output .fraction { display: inline-flex; flex-direction: column; text-align: center; vertical-align: middle; margin: 0 0.2em; }
        #solution-output .numerator { padding: 0 0.2em; border-bottom: 1px solid var(--text-color-solver); }
        #solution-output .denominator { padding: 0 0.2em; }
        #solution-output strong { color: var(--primary-color); }
        #solution-output em { font-style: italic; color: #555; }
        html[data-theme="dark"] #solution-output em { color: #ccc; }
        #solution-output.error { color: var(--error-color); font-weight: 500; }

        .loader {
            width: 24px;
            height: 24px;
            border: 3px solid #6e8efb;
            border-bottom-color: transparent;
            border-radius: 50%;
            display: inline-block;
            animation: spin 1s linear infinite;
        }
        
        .button-loader { width: 20px; height: 20px; border: 2px solid #fff; border-bottom-color: transparent; }
        .loader-container { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; min-height: 100px; color: var(--text-color-solver); opacity: 0.7; }

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .hidden { display: none; }
        
        @media (max-width: 600px) {
            .calculator-container { padding: 1.5rem; }
            h1 { font-size: 1.8rem; }
        }
    </style>

    <main class="container">
        <div class="calculator-container">
            <h1>AI Solver</h1>
            <form id="ai-solver-form">
                <label for="question-input" class="sr-only">Enter your question here</label>
                <textarea id="question-input" name="question-input" rows="4" placeholder="Enter your question on any topic here... (e.g., 'What is a noun?', 'Explain the law of gravity', or 'Solve 2x + 5 = 15')" required></textarea>
                <button type="submit" id="solve-button">
                    <span id="button-text">Solve</span>

                </button>
            </form>

            <div id="solution-container" class="solution-container hidden">

    <script type="module">
        import { GoogleGenAI } from "https://esm.run/@google/genai";

        const form = document.getElementById('ai-solver-form');
        const questionInput = document.getElementById('question-input');
        const solveButton = document.getElementById('solve-button');
        const buttonText = document.getElementById('button-text');
        const buttonLoader = document.getElementById('button-loader');
        const solutionContainer = document.getElementById('solution-container');
        const solutionOutput = document.getElementById('solution-output');
        
        const apiKey = "AIzaSyAVEPlqyyOEMqDZkIqMcof7q0KEhWsiVp8";
        const ai = new GoogleGenAI({ apiKey });

        const systemInstruction = "You are an expert AI assistant for GK Learn Study. Your primary language is Hindi. Your job is: 1. To answer the user's question in a detailed, step-by-step, and easy-to-understand manner. 2. Format your response using specific HTML tags based on the subject: - For **Mathematics**: Use `<sup>` for exponents. For fractions, use this structure: `<div class='fraction'><span class='numerator'>...</span><span class='denominator'>...</span></div>`. - For **Chemistry**: Use `<sub>` for chemical formulas (e.g., `H<sub>2</sub>O`). - For **Hindi Grammar** or other subjects: Use `<strong>` to highlight key terms or definitions and `<em>` for examples. 3. Wrap each paragraph in `<p>` tags and bold the final answer with `<strong>` tags. Make sure all UI text is in English, like 'Solving...', 'Solution:', etc.";
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const userQuestion = questionInput.value.trim();
            if (!userQuestion) return;

            setLoading(true);

            let topResult = null;
            try {
                await window.GKApp.dataReady;
                const searchData = window.GKApp?.searchData || [];
                const fuzzySearch = window.GKApp?.fuzzySearch;
                
                if (fuzzySearch && searchData.length > 0) {
                    const searchResults = fuzzySearch(userQuestion, searchData);
                    topResult = searchResults.length > 0 ? searchResults[0] : null;
                }
            } catch (searchError) {
                console.warn("Local search failed or was not available.", searchError);
            }
            
            if (!topResult) {
                // If no local result is found, don't call the AI. Directly inform the user.
                displaySolution("<p>The answer to this question is not available on the website.</p>");
                return;
            }

            const prompt = `The user's question is: "${userQuestion}"

            MANDATORY CONTEXT FROM gklearnstudy.in:
            Title: "${topResult.title}"
            Content: "${topResult.paragraph}"

            *** YOUR TASK - VERY IMPORTANT ***
            1. You MUST answer the user's question.
            2. You MUST base your entire answer ONLY on the "MANDATORY CONTEXT" provided above. Do NOT use any other knowledge.
            3. You MUST apply the special formatting rules (math, chemistry, grammar) as defined in the system instructions.
            4. After your answer, you MUST append the source link using this EXACT HTML format: <p><strong>Source:</strong> <a href="${topResult.url}" target="_blank" rel="noopener noreferrer">${topResult.title}</a></p>
            5. If the provided context is not relevant to the user's question, you MUST respond ONLY with the exact HTML: "<p>The answer to this question is not available on the website.</p>"`;

            try {
                const response = await ai.models.generateContent({
                    model: 'gemini-2.5-flash',
                    contents: prompt,
                    config: { systemInstruction: systemInstruction }
                });
                
                const solutionText = response.text;
                displaySolution(solutionText);

            } catch (apiError) {
                console.error("Gemini API Error:", apiError);
                // **FALLBACK LOGIC**
                const fallbackHTML = `<p>${topResult.paragraph}</p>
                                      <p><strong>Source:</strong> <a href="${topResult.url}" target="_blank" rel="noopener noreferrer">${topResult.title}</a></p>
                                      <p><em>(Note: The AI solver is currently unavailable. Showing the most relevant result from the website directly.)</em></p>`;
                displaySolution(fallbackHTML);
            }
        });

        function setLoading(isLoading) {
            solveButton.disabled = isLoading;
            if (isLoading) {
                buttonText.classList.add('hidden');
                buttonLoader.classList.remove('hidden');
                solutionContainer.classList.remove('hidden');
                solutionOutput.innerHTML = `<div class="loader-container"><div class="loader"></div><p>Solving...</p></div>`;
                solutionOutput.classList.remove('error');
            } else {
                buttonText.classList.remove('hidden');
                buttonLoader.classList.add('hidden');
            }
        }

        function displaySolution(htmlText) {
            setLoading(false); // Turn off loading state when displaying any solution.
            solutionOutput.innerHTML = htmlText;
            solutionOutput.classList.remove('error');
            solutionContainer.classList.remove('hidden');
        }

        function showError(message) {
            setLoading(false);
            solutionOutput.textContent = message;
            solutionOutput.classList.add('error');
            solutionContainer.classList.remove('hidden');
        }
    </script>
